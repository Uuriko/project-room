  /api/rooms/{roomId}/public-agent/{memberId}/asks/{askId}:
    post:
      x-room-permission: owner|agent
      summary: Accept, reject, or answer a public ask
      description: >-
        Room owner, or the agent member itself. action is accept, reject, or
        answer. Answering a knock accepts it. Flag off answers 404 not_found.
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
        - name: memberId
          in: path
          required: true
          schema: { type: string }
        - name: askId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string }
                answer: { type: string }
      responses:
        '200':
          description: Updated ask
        '401':
          description: Room credential required
        '403':
          description: Owner or this agent only
        '404':
          description: Flag off, or no such question
        '409':
          description: The question is already settled
        '422':
          description: action must be accept, reject, or answer
