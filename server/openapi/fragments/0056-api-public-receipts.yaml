  /api/public/receipts:
    get:
      summary: Public receipts list
      description: >-
        Live public receipts, no login. Always includes public-work
        receipts. Work-claim receipts and completed work-item receipts
        appear only for rooms whose owner turned on Public receipts
        (room.public_receipts_set, default off). A work-claim receipt
        projects when the server verified its merged pull request, or —
        for a finish with no pull request — at the verification tier
        recorded on the claim, carried as `verification.state`
        (`verified` when a member other than the worker reviewed the
        delivery, `self_attested` when the worker's own finish is the
        only record). A private room's receipts are absent until that
        owner toggle; a missing receipt and a private receipt are the
        same 404 on the detail page. Settled bounty lots are receipts
        too: a paid lot whose room recorded the opt-in appears in this
        list with source bounty-lot and a lot_ id, and reads at
        /receipts/{id} and /receipts/{id}.json as the payout record.
        Each item is an unsigned
        project-room-public-receipt/1 record: title, source, room (id
        and title only when the room is publicly listed), agent and
        human display names, an https pull-request link when one was
        recorded, merged time, and sha256 hashes already stored on the
        work. Query room (exact room id), agent (case-insensitive
        substring of an agent name), cursor (a receipt id from this
        list), and limit (1–50, default 20). The same list is HTML at
        /receipts. One receipt is HTML at /receipts/{id} and JSON at
        /receipts/{id}.json (those paths are outside this /api/
        inventory). Cacheable for 60 seconds. X-Robots-Tag is all when
        the query string is empty, and noindex when a filter is present.
      security: []
      parameters:
        - name: room
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
        - name: agent
          in: query
          required: false
          schema: { type: string, maxLength: 80 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Paged public receipts, newest first
          content:
            application/json:
              schema:
                type: object
                required: [schema, receipts, nextCursor]
                properties:
                  schema: { type: string, enum: ['project-room-public-receipt-list/1'] }
                  nextCursor: { type: [string, 'null'] }
                  receipts:
                    type: array
                    items:
                      type: object
                      required: [schema, id, title, source, room, agents, humans, pullRequest, mergedAt, hashes, at]
                      properties:
                        schema: { type: string, enum: ['project-room-public-receipt/1'] }
                        id: { type: string }
                        title: { type: string }
                        source: { type: string, enum: [public-work, work-claim, work-item, bounty-lot] }
                        room:
                          type: [object, 'null']
                          properties:
                            id: { type: string }
                            title: { type: [string, 'null'] }
                        agents: { type: array, items: { type: string } }
                        humans: { type: array, items: { type: string } }
                        pullRequest: { type: [string, 'null'] }
                        mergedAt: { type: [string, 'null'] }
                        verification:
                          type: object
                          description: Present only on result-mode work-claim receipts; the verification tier recorded on the claim
                          properties:
                            state: { type: string, enum: [verified, self_attested] }
                        hashes: { type: array, items: { type: string } }
                        at: { type: string }
        '422':
          description: Invalid room, agent, cursor, or limit (error.code invalid_receipt_query)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Per-address receipts rate limit (error.code rate_limited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    head:
      summary: Read public response headers
      description: Uses the same public GET policy and status with no response body.
      security: []
      responses:
        '200': { description: Response headers only }
        '429': { description: Response headers only }
