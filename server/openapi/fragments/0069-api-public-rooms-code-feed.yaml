  /api/public/rooms/{code}/feed:
    get:
      summary: Public read-only message feed
      description: >-
        Paginated public messages for an enabled public face, newest first.
        Same privacy guarantees as /api/public/rooms/{code}. Cursor `after`
        is an opaque message cursor; `limit` is capped at 100 (default 50).
      security: []
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
        - name: after
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Page of public messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        from: { type: string }
                        body: { type: string }
                        at: { type: [string, 'null'] }
                  hasMore: { type: boolean }
                  next: { type: [string, 'null'] }
                  fetchedAt: { type: integer }
        '404':
          description: Unknown, malformed, or disabled public code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '429':
          description: Per-address public-face rate limit (error.code rate_limited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

