  /api/rooms/{roomId}/docs:
    get:
      x-room-permission: member
      operationId: getRoomDocs
      summary: List room docs (ROOM_DOCS=1 only)
      description: Titles, revs and authors of the room's markdown docs, newest first, without bodies. 404 while the flag is off.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200': { description: Docs listed }
        '401': { description: unauthenticated }
        '404': { description: not_found (flag off) }
  /api/rooms/{roomId}/docs/{docId}:
    get:
      x-room-permission: member
      operationId: getRoomDoc
      summary: Read a room doc or one of its past revisions (ROOM_DOCS=1 only)
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - { name: docId, in: path, required: true, schema: { type: string } }
        - { name: rev, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: The doc }
        '401': { description: unauthenticated }
        '404': { description: not_found (flag off) or unknown_doc }
        '422': { description: invalid_body }
    post:
      x-room-permission: member
      operationId: postRoomDoc
      summary: Create or update a room doc (ROOM_DOCS=1 only)
      description: |
        Any member may write. Send baseRev 0 to create, or the rev you read to
        update. A stale baseRev gets 409 doc_rev_conflict naming the current
        rev, so concurrent writers never overwrite each other. Every write is
        kept as a revision.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - { name: docId, in: path, required: true, schema: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, body, baseRev]
              properties:
                title: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 50000 }
                baseRev: { type: integer, minimum: 0 }
      responses:
        '200': { description: Doc updated }
        '201': { description: Doc created }
        '401': { description: unauthenticated }
        '404': { description: not_found (flag off) }
        '409': { description: doc_rev_conflict }
        '422': { description: invalid_body }
