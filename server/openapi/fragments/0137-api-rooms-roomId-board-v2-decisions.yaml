  /api/rooms/{roomId}/board/v2/decisions:
    get:
      summary: List board decisions
      deprecated: true
      tags: [Board v2]
      description: Retired. Every authenticated board/v2 route returns 410 board_v2_retired; use the work-claims board.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: decider
          in: query
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string }
        - name: since_seq
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '401': { description: unauthenticated }
        '410': { description: board_v2_retired }
        '200':
          description: Decisions
          content:
            application/json:
              schema:
                type: object
                required: [watermark, decisions]
                properties:
                  watermark: { type: integer }
                  decisions: { type: array, items: { $ref: '#/components/schemas/BoardV2Decision' } }
    post:
      summary: Record a board decision
      deprecated: true
      tags: [Board v2]
      description: Retired. Every authenticated board/v2 route returns 410 board_v2_retired; use the work-claims board.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, statement]
              additionalProperties: false
              properties:
                scope: { type: string, minLength: 1, maxLength: 128 }
                statement: { type: string, minLength: 1, maxLength: 2000 }
                reversible: { type: boolean }
                supersedes: { type: integer, minimum: 1 }
      responses:
        '401': { description: unauthenticated }
        '410': { description: board_v2_retired }
        '201':
          description: Decision recorded
          content:
            application/json:
              schema:
                type: object
                required: [watermark, seq, decision]
                properties:
                  watermark: { type: integer }
                  seq: { type: integer }
                  decision: { $ref: '#/components/schemas/BoardV2Decision' }
