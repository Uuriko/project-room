  /api/rooms/{roomId}/receipts:
    get:
      summary: Search completed-work receipts
      description: |
        The "what has this room already solved" surface: done work-claim
        items projected as receipts, most recently completed first. In
        current-format (native) rooms, which never write Board claims,
        terminal native completions (completed, with receipt evidence,
        and verification satisfied or owner-approved where required) are
        projected as receipts the same way. Each
        receipt carries a stable `receiptId` (`"rc_" + workItemId`), the
        work item id, free-form `tags` recorded on the done transition,
        a 240-char `summary` (the completion note, falling back to the
        title), the completing member (`createdBy`), the completion time
        as a ms epoch (`createdAt`), and `blobs` (sha256 evidence
        pointers, empty when none). Each receipt also carries `publicId`
        and `publicUrl` naming its public twin when one resolves (the
        room opted in to public receipts and the claim projected), null
        when it does not. Summaries + blob pointers only — full
        bodies stay on the work-claim read route. Member-only (403
        `not_member`); API keys need `rooms:read`.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: q
          in: query
          required: false
          schema: { type: string, maxLength: 500 }
          description: Case-insensitive substring over the receipt's title and history notes
        - name: tag
          in: query
          required: false
          schema: { type: string, pattern: '[A-Za-z0-9_-]{1,32}' }
          style: form
          explode: true
          description: Exact tag match; repeatable, AND semantics
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Opaque base64url cursor from a prior response's nextCursor; malformed cursors get 400 bad_cursor
      responses:
        '200':
          description: The matching receipts, newest completion first
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Receipt'
                  nextCursor:
                    type: [string, 'null']
                    description: Opaque cursor for the next page; null when there are no more results
        '400': { description: bad_cursor }
        '401': { description: unauthenticated }
        '403': { description: not_member }
        '405':
          description: >-
            method_not_allowed: this route only serves GET. A wrong-method
            response may carry an RFC 9110 Allow header naming the route's
            allowed methods — resend with a named method instead of
            retrying the same one.
        '422': { description: invalid_receipt_query }
  /api/rooms/{roomId}/receipts/{receiptId}:
    get:
      summary: Read one receipt by its receiptId
      description: |
        Read a single completed-work receipt by the stable `receiptId`
        (`"rc_" + workItemId`) issued by the receipts list, so a caller who
        saved a receiptId can re-find that outcome without re-listing and
        searching. Same member contract as the list: member-only (403
        `not_member`); API keys need `rooms:read`. A receiptId with no
        `done` claim (or, in a current-format room, no terminal native
        completion) behind it in this room returns 404 `receipt_not_found`.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: receiptId
          in: path
          required: true
          schema: { type: string, maxLength: 256 }
          description: The `rc_`-prefixed receipt identifier from the receipts list
      responses:
        '200':
          description: The receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  receipt:
                    $ref: '#/components/schemas/Receipt'
        '401': { description: unauthenticated }
        '403': { description: not_member }
        '404': { description: receipt_not_found }
        '405':
          description: >-
            method_not_allowed: this route only serves GET. A wrong-method
            response may carry an RFC 9110 Allow header naming the route's
            allowed methods — resend with a named method instead of
            retrying the same one.
