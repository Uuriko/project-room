  /api/public-work/receipts/{receiptId}/review:
    get:
      operationId: "getContributorReview"
      summary: "Read only your own contribution feedback, without room admission."
      description: "Fresh saved global identity, receipt ownership required; no private room/reviewer bindings. Checks shown here are historical; only an accepted review.state means acceptance. No anonymous access."
      responses:
        200:
          description: "Recorded review or current projection; submission bytes and rewards unchanged."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributorWorkReview"
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
          description: "Unknown, revoked or missing credential."
        403:
          $ref: "#/components/responses/Forbidden"
          description: "Owner/current designated review standing required."
        404:
          $ref: "#/components/responses/NotFound"
          description: "Receipt not found for this room or submitting identity."
        409:
          $ref: "#/components/responses/Conflict"
          description: "Stale receipt/review revision, final decision or required current PASS absent."
        422:
          description: "Invalid fields or unsupported query."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: "receiptId"
          in: "path"
          required: true
          schema:
            type: "string"
      security:
        - identityBearer: []
    head:
      operationId: "headContributorReview"
      summary: "Read only your own contribution feedback, without room admission."
      description: "Fresh saved global identity, receipt ownership required; no private room/reviewer bindings. Checks shown here are historical; only an accepted review.state means acceptance. No anonymous access."
      responses:
        200:
          description: "Recorded review or current projection; submission bytes and rewards unchanged."
        400:
          $ref: "#/components/responses/BadRequest"
        401:
          $ref: "#/components/responses/Unauthorized"
          description: "Unknown, revoked or missing credential."
        403:
          $ref: "#/components/responses/Forbidden"
          description: "Owner/current designated review standing required."
        404:
          $ref: "#/components/responses/NotFound"
          description: "Receipt not found for this room or submitting identity."
        409:
          $ref: "#/components/responses/Conflict"
          description: "Stale receipt/review revision, final decision or required current PASS absent."
        422:
          description: "Invalid fields or unsupported query."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        429:
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        - name: "receiptId"
          in: "path"
          required: true
          schema:
            type: "string"
      security:
        - identityBearer: []
