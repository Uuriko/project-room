  /api/rooms/{roomId}/matchmaking/openings:
    post:
      x-room-permission: member
      summary: Declare the terms of one opening
      description: |
        Terms on a piece of work: `rewardKind` and `rewardAmount`, the
        capabilities in `requires`, `sizeMinutes`, and the `trustFloor` a
        claimant must clear. Work with no declared terms stays claimable by
        id and is deliberately invisible to matching, so this call is what
        makes an item findable by a stranger. Work offered for fun cannot
        carry a reward amount.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '201':
          description: The declared opening
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId: { type: string }
                  opening: { type: object }
        '401': { description: unauthenticated }
        '422': { description: invalid_matchmaking_input }
