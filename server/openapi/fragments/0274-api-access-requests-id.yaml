  /api/access-requests/{id}:
    get:
      summary: Check an identity's join or permission request status
      description: >-
        For join requests the caller supplies the matching identityId as a
        query parameter; other IDs receive 404. Permission requests also
        require that identity's current secret as a Bearer credential. A
        room-only human member instead retries the original room-authenticated
        request with the same requestId to retrieve its record.
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: identityId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Request kind and status, with a status-aware next hint; denied, cancelled, and expired records require a fresh requestId for a new request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPermissionRequestRecord'
        '404': { description: not_found }
        '422': { description: invalid_request }
    post:
      summary: Withdraw a pending join request
      description: >-
        Requires the current, unrevoked identity secret as Authorization: Bearer
        and its identityId in the body. Public IDs alone confer no authority.
        A valid different identity receives 404 for another identity's request. A
        cancelled request leaves the pending queue. Repeating a cancel is
        idempotent. A request that is no longer pending returns 409.
      security:
        - bearerAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [identityId]
              properties:
                identityId: { type: string }
      responses:
        '200': { description: The request with status cancelled }
        '401': { description: "Missing, mismatched, stale, or revoked identity credential" }
        '404': { description: not_found }
        '409': { description: already_decided }
        '422': { description: invalid_request }
        '429': { description: rate_limited }
