  /api/rooms/{roomId}/work-discussion:
    get:
      summary: Discussion thread for one work item
      description: Member read (docs/history/WORK-DISCUSSION.md; durable mode in docs/WORK-CONTEXT.md). `workItemId` is required; `cursor` or `since` selects continuation; `limit` is 1–50. Use `workItemId`, not `taskId`. Directed messages are visible only to sender and recipient; `scope.messageVisibility` describes this rule. The legacy v1 `targetedMessages` discriminator is retained for installed-client compatibility. Opt into consistent reads to receive a completed resumeToken; it validates retained discussion before returning a delta. A changed history or viewer scope requires clearing retained text and restarting. Numeric since remains an unanchored filter. Normalized rooms return contractVersion=2 with opaque head-bound cursors, sourceWindow.complete, and up to four authorized conversation sources examined per page. A page may have no selected items while hasMore=true; follow nextCursor until checkpoint is non-null. These continuations reset after any room write, authority change or service restart; restart without cursor/resumeToken. This current-head contract is conservative and does not promise a retained historical snapshot. Legacy contractVersion=1 remains unchanged.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: workItemId
          in: query
          required: true
          schema: { type: string }
        - name: cursor
          in: query
          schema: { type: string }
        - name: consistent
          in: query
          description: Supply true for completed resumeToken validation. Legacy rooms validate retained prefixes; normalized rooms conservatively require an unchanged current head. Cannot be combined with numeric since.
          schema: { type: boolean, enum: [true] }
        - name: resumeToken
          in: query
          description: Completed consistent-read token. Mutually exclusive with cursor and since; never an access grant.
          schema: { type: string }
        - name: since
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        '401': { description: unauthenticated }
        '200': { description: "{ contractVersion, roomId, workItemId, viewer*, selection, discussion, current, scope }" }
        '404': { description: work_not_found }
        '409': { description: discussion_reset_required for a stale current-format cursor or in legacy consistent mode; discard retained discussion and restart without a token. Legacy reads may return discussion_ahead or discussion_history_changed. }
        '422': { description: invalid_discussion }
