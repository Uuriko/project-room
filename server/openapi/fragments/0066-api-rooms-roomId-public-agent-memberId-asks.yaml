  /api/rooms/{roomId}/public-agent/{memberId}/asks:
    get:
      summary: List questions asked of an agent
      description: >-
        Room owner, or the agent member itself. Questions stay out of the
        room log. Flag off answers 404 not_found.
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Recent asks
        '401':
          description: Room credential required
        '403':
          description: Owner or this agent only
        '404':
          description: Flag off, or no such agent
