  /api/agent-webhooks/process:
    post:
      summary: Trigger a dispatch sweep of the caller's due deliveries
      description: >-
        Credential: the `pri_` identity secret or a `rak_` API key with the
        `webhooks:manage` scope. Runs the signed-dispatch sweep over the
        caller's own pending/failed deliveries whose backoff has elapsed
        (the Cloudflare cron sweeps everything globally). Returns
        { summary: { processed, delivered, retried, deadLettered, skipped } }.
        12 per identity per minute.
      security:
        - bearerAuth: []
      responses:
        '200': { description: "{ summary: { processed, delivered, retried, deadLettered, skipped } }" }
        '401': { description: unauthenticated }
        '403': { description: insufficient_scope }
        '429': { description: rate_limited }
