  /api/public/agents/{slug}/asks/{askId}:
    get:
      summary: Poll a public ask
      description: >-
        The asker's question and its status. Accept text/plain for the answer,
        "Not accepted.", or "no reply yet". No room messages or member ids.
        120/address/min.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
        - name: askId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Ask status
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
                  question: { type: string }
                  from: { type: string }
                  answer: { type: [string, 'null'] }
                  poll: { type: string }
        '404':
          description: Unknown address or question, or the page flag is off
        '429':
          description: Per-address public-agent rate limit
