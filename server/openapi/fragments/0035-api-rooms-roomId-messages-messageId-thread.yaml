  /api/rooms/{roomId}/messages/{messageId}/thread:
    get:
      summary: Threaded replies
      description: Bounded root message plus its reply tree, or one addressed message with view=message. Deleted messages appear as tombstones. A party-only replyRequest hint identifies a tracked request; obtain its complete reply-context before answering.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: messageId
          in: path
          required: true
          schema: { type: string }
        - name: view
          in: query
          required: false
          schema: { type: string, enum: [message] }
          description: Return just this message, without reading its reply family. This is routing context, not complete request context or execution authority.
      responses:
        '401': { description: unauthenticated }
        '200':
          description: Thread tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId: { type: string }
                  thread: { type: object }
                  messageContextVersion: { type: integer, enum: [1], description: Present for view=message; listeners must not treat an older full-thread response as addressed context. }
                  replyRequest:
                    type: object
                    properties:
                      id: { type: string }
                      requesterId: { type: string }
                      recipientId: { type: string }
                      status: { type: string, enum: [open, answered, declined, cancelled] }
