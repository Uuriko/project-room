  /api/rooms/{roomId}/work-claims/{claimId}/premise-invalid:
    post:
      x-room-permission: claim_owner|owner|manage_claims
      summary: Declare a claim's premise invalid (practiced rollback)
      description: |
        Flags this claim and every downstream claim from the provenance walk
        for re-review: each gets a `premiseFlag` { premiseId, reason, by, at }
        and a `premise_flagged` history stamp, and each flagged claim's owner
        is woken. Nothing is reverted — flag + notify is the whole rollback.
        Send `{ clear: true, note? }` to lift one claim's flag after
        re-review. Only the claim's owner, the room owner, or a member with
        manage_claims may declare or clear. API keys need `rooms:write`.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Why the premise is invalid (1..2000 characters). Flags the claim and its downstream.
                clear:
                  type: boolean
                  description: true lifts this claim's premise flag after re-review; send note instead of reason.
                note:
                  type: string
                  description: Optional note recorded with the clear.
      responses:
        '200':
          description: "Flagged claim ids (or cleared: true)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId: { type: string }
                  claimId: { type: string }
                  premiseInvalid: { type: boolean }
                  cleared: { type: boolean }
                  flagged:
                    type: array
                    items: { type: string }
                  truncated: { type: boolean }
        '401': { description: unauthenticated }
        '403': { description: work_not_owner — the claim's owner, the room owner, or manage_claims may declare; also insufficient_scope (API key without rooms:write), guest_scope_denied, not_member, or agent_readonly }
        '404': { description: work_claim_not_found }
        '409': { description: room_event_budget_low — the room is nearly out of room events; only the owner and claim managers may write }
        '422': { description: invalid_claim_input }
        '429': { description: Rate limit exceeded (rate_limited). }
