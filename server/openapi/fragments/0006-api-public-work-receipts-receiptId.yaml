  /api/public-work/receipts/{receiptId}:
    get:
      operationId: "getPublicWorkReceipt"
      summary: "Read a public-work receipt; the read composes the recorded review outcome (verified on acceptance, or the rejection / revision-request decision) onto the stored record. Payment settles only through the review's settlement step."
      description: "Public: no credential required."
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PublicWorkReceipt"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: "Invalid fields, unsupported query or ineligible owner task."
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        -
          name: "receiptId"
          in: "path"
          required: true
          schema:
            type: "string"
      security: []
    head:
      operationId: "headPublicWorkReceipt"
      summary: "Read a public-work receipt; the read composes the recorded review outcome (verified on acceptance, or the rejection / revision-request decision) onto the stored record. Payment settles only through the review's settlement step."
      description: "Public: no credential required."
      responses:
        "200":
          description: "OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: "Invalid fields, unsupported query or ineligible owner task."
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        -
          name: "receiptId"
          in: "path"
          required: true
          schema:
            type: "string"
      security: []
