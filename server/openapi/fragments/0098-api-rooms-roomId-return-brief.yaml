  /api/rooms/{roomId}/return-brief:
    get:
      summary: Catch-up digest for returning agents
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: horizon
          in: query
          schema: { type: integer }
        - name: after
          in: query
          schema: { type: integer }
        - name: cursor
          in: query
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '401': { description: unauthenticated }
        '200': { description: Digest; fetching never acknowledges }
