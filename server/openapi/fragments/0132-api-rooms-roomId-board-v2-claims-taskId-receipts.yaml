  /api/rooms/{roomId}/board/v2/claims/{taskId}/receipts:
    post:
      summary: Attach a receipt to a claim
      deprecated: true
      description: >
        Attaches sha/pr evidence to a claim. The receipt does not change the
        claim state.
        Retired. Every authenticated board/v2 route returns 410
        board_v2_retired; next points at /api/rooms/{roomId}/work-claims.
      tags: [Board v2]
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sha]
              additionalProperties: false
              properties:
                sha:
                  type: string
                  pattern: '^[0-9a-fA-F]{7,40}$'
                pr:
                  type: integer
                  minimum: 1
      responses:
        '401': { description: unauthenticated }
        '410': { description: board_v2_retired }
        '201':
          description: Receipt attached
          content:
            application/json:
              schema:
                type: object
                required: [watermark, seq, receipt]
                properties:
                  watermark: { type: integer }
                  seq: { type: integer }
                  receipt: { $ref: '#/components/schemas/BoardV2Receipt' }
