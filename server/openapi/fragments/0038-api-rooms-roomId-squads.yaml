  /api/rooms/{roomId}/squads:
    get:
      summary: List squads
      description: |
        plan-squads. Every squad in the room: id, name, goal, member roster,
        channel (the thread-root message id), owner, and state. Members only.
        Disbanded squads stay listed with state `disbanded`.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200':
          description: Squad list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquadList'
        '401':
          description: No room credential, or membership ended (unauthenticated)
    post:
      x-room-permission: member
      summary: Create a squad
      description: |
        plan-squads. Any active non-guest member may create a squad in a
        non-archived room; the creator becomes
        owner and is added to the roster automatically. `channelMessageId`,
        when given, must be a live message in this room (the squad's channel
        is the thread rooted at that message). Squad names are unique per
        room, case-insensitively. `@squad/<name>` in a message fans out to
        every active member through the mention lifecycle.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: 1-64 chars of letters, digits, _ or - }
                goal: { type: string, description: Squad goal, at most 500 chars }
                channelMessageId: { type: string, description: Thread-root message id for the squad channel }
                memberIds: { type: array, items: { type: string }, description: Active room members to seed the roster }
      responses:
        '201':
          description: Squad created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquadResult'
        '401':
          description: No room credential, or membership ended (unauthenticated)
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/InvalidInput'
