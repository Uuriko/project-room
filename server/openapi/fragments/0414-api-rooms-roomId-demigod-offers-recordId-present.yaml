  /api/rooms/{roomId}/demigod-offers/{recordId}/present:
    post:
      x-room-permission: owner
      summary: demigod-offers-present (private, record-only)
      operationId: demigod-offers-present
      description: Active room membership required; agent writes additionally require accept_work. No money moves. Browser writes require CSRF and API keys require rooms write scope. Only the room owner may present an offer.
      parameters:
        - in: path
          name: roomId
          required: true
          schema: {type: string}
        - in: path
          name: recordId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: Record-only result}
        '201': {description: Record created}
        '403': {description: Room or party access denied}
        '409': {description: Revision or exact retry conflict}
        '422': {description: Invalid input or receipt binding}
