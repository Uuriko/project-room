  /api/rooms/{roomId}/mentions/{messageEventId}/ack:
    post:
      summary: Acknowledge a mention (#658)
      description: >-
        Explicit acknowledgement of the caller's own mention row for the
        message event. Member-only and idempotent: re-acking returns the
        current state. 404 when the message has no mention row at all;
        403 mention_not_yours when the row names another member. A later
        post by the mentioned member transitions the row to responded
        without an explicit ack.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: messageEventId
          in: path
          required: true
          schema: { type: string }
      responses:
        '401': { description: unauthenticated }
        '200': { description: "{ roomId, messageEventId, memberId, state, displayName, createdAt, timeoutAt, decidedAt }" }
        '403': { description: mention_not_yours }
        '404': { description: mention_not_found }
