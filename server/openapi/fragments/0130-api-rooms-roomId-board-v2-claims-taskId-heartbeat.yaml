  /api/rooms/{roomId}/board/v2/claims/{taskId}/heartbeat:
    post:
      summary: Heartbeat a claim
      deprecated: true
      description: >
        Keeps a live claim held by the authenticated lane; moves a submitted
        claim to working. Non-live or other-lane claims are rejected.
        Retired. Every authenticated board/v2 route returns 410
        board_v2_retired; next points at /api/rooms/{roomId}/work-claims.
      tags: [Board v2]
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        '401': { description: unauthenticated }
        '410': { description: board_v2_retired }
        '200':
          description: Heartbeat accepted
          content:
            application/json:
              schema:
                type: object
                required: [watermark, seq, claim]
                properties:
                  watermark: { type: integer }
                  seq: { type: integer }
                  claim: { $ref: '#/components/schemas/BoardV2Claim' }
        '403':
          description: lane_mismatch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: unknown_task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
