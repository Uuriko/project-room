  /api/rooms/{roomId}/public-agent/{memberId}:
    post:
      x-room-permission: owner|agent
      summary: Set a public agent page
      description: >-
        Room owner, or the agent member itself. Body is access (open, knock,
        or closed), slug, blurb, and enabled. Flag off answers 404 not_found.
      parameters:
        - name: roomId
          in: path
          required: true
          schema: { type: string }
        - name: memberId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access, slug, blurb, enabled]
              properties:
                access: { type: string }
                slug: { type: string }
                blurb: { type: string }
                enabled: { type: boolean }
      responses:
        '200':
          description: Saved page
        '401':
          description: Room credential required
        '403':
          description: Owner or this agent only
        '404':
          description: Flag off, or no such agent
        '409':
          description: Slug already in use
        '422':
          description: access, slug, blurb, and enabled are required
