  /api/rooms/{roomId}/board/v2/notes:
    get:
      summary: List board notes
      deprecated: true
      tags: [Board v2]
      description: Retired. Every authenticated board/v2 route returns 410 board_v2_retired; use the work-claims board.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: lane
          in: query
          schema: { type: string }
        - name: thread
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema:
            type: string
            enum: [info, milestone, warning]
        - name: since_seq
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '401': { description: unauthenticated }
        '410': { description: board_v2_retired }
        '200':
          description: Notes
          content:
            application/json:
              schema:
                type: object
                required: [watermark, notes]
                properties:
                  watermark: { type: integer }
                  notes: { type: array, items: { $ref: '#/components/schemas/BoardV2Note' } }
    post:
      summary: Post a board note
      deprecated: true
      tags: [Board v2]
      description: Retired. Every authenticated board/v2 route returns 410 board_v2_retired; use the work-claims board.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              additionalProperties: false
              properties:
                thread: { type: string, minLength: 1, maxLength: 128 }
                body: { type: string, minLength: 1, maxLength: 500 }
                severity:
                  type: string
                  enum: [info, milestone, warning]
      responses:
        '401': { description: unauthenticated }
        '410': { description: board_v2_retired }
        '201':
          description: Note posted
          content:
            application/json:
              schema:
                type: object
                required: [watermark, seq, note]
                properties:
                  watermark: { type: integer }
                  seq: { type: integer }
                  note: { $ref: '#/components/schemas/BoardV2Note' }
