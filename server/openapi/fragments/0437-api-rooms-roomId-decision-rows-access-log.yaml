  /api/rooms/{roomId}/decision-rows/access-log:
    get:
      x-room-permission: owner
      summary: Read the evidence access log for a room
      description: >-
        Owner-only. Entries name the reader, the kind (export or
        evidence_read), the surface, the record id when the read was for
        one record, and the time; export entries also name the schema
        version and row count. Newest first.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: limit
          in: query
          description: 1 to 500 (default 100); anything else is 422 invalid_access_log
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        '401': { description: unauthenticated }
        '403': { description: owner_required - only the room owner reads the access log }
        '200':
          description: "{ roomId, entries }"
          content:
            application/json:
              schema: { type: object }
        '422': { description: invalid_access_log }
