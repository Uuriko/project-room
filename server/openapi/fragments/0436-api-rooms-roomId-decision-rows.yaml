  /api/rooms/{roomId}/decision-rows:
    get:
      x-room-permission: owner
      summary: Export per-subject decision rows (decision-rows/1)
      description: >-
        Owner-only (403 owner_required for other members). One row per
        verdict across public-work reviews, bounty verdicts and board
        claim reviews, in the stable decision-rows/1 schema documented in
        docs/DECISION-ROWS.md. The payload is materialised in full before
        the response starts; each export of a live room appends a
        room.exported audit event naming the schema version, row count
        and requester, and writes an export row to the evidence access
        log, before the payload is sent.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '401': { description: unauthenticated }
        '403': { description: owner_required - only the room owner exports decision rows }
        '200':
          description: "{ schema, roomId, generatedAt, requestedBy, rowCount, fields, rows, auditEventId }"
          content:
            application/json:
              schema: { type: object }
        '422': { description: invalid_decision_export - the export takes no parameters }
