  /api/rooms/{roomId}/events:
    get:
      summary: Read the event log
      description: |
        Ordered events strictly after the `after` sequence. The cursor query
        parameter is `after`, not `afterSequence`. Sending `afterSequence`
        (alone or with `after`) is 422 `invalid_event_cursor`: it is not
        applied as a filter, and it does not mean the caller is caught up.
        Pass the previous response's `next` back as `after`.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: after
          in: query
          description: >
            Sequence strictly before the page. `0` or digits without a leading
            zero (`^(0|[1-9]\d*)$`). Anything else is 422 `invalid_event_cursor`,
            and the message names `after`.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: >
            Digits only (`^[1-9]\d*$`), from 1 to 100. An exponent, a leading
            zero, a sign, or a space is 422 `invalid_event_cursor`, and the
            message names `limit` and the range.
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
        - name: actor
          in: query
          description: Only events by this member (audit filter)
          schema: { type: string }
        - name: since
          in: query
          description: >
            Only events at or after this instant. RFC 3339 with `Z` or a
            numeric offset, for example `2026-10-24T20:30:00Z`. A zone-less
            timestamp or a bare date is 422 `invalid_event_cursor`, and the
            message names `since`. `since` later than `until` is 422.
          schema: { type: string, format: date-time }
        - name: until
          in: query
          description: >
            Only events at or before this instant. RFC 3339 with `Z` or a
            numeric offset, for example `2026-10-24T20:30:00Z`. A zone-less
            timestamp or a bare date is 422 `invalid_event_cursor`, and the
            message names `until`. `since` later than `until` is 422.
          schema: { type: string, format: date-time }
        - name: type
          in: query
          description: Only events of these types (comma-separated, e.g. `message.posted,work_item.updated`); applied server-side, the cursor still advances by what was scanned
          schema: { type: string }
        - name: mentions
          in: query
          description: Only events that @mention this member id (or `me` for the caller); applied server-side
          schema: { type: string }
        - name: compact
          in: query
          description: When `1`/`true`, each event drops envelope noise a poller never acts on (idempotencyKey, the repeated roomId, a null causationId, mention-chip displayName); event data is unchanged
          schema: { type: string, enum: ['1', '0', 'true', 'false'] }
        - name: tail
          in: query
          description: |
            Newest N events in ascending order, plus `next` to continue forward
            with `after`. An integer from 1 to 200. Send `tail` alone: combining
            it with `after`, `limit`, `actor`, `since`, `until`, `type`,
            `mentions`, `compact`, or `afterSequence` is 422 `invalid_event_cursor`.
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        '401': { description: unauthenticated }
        '200':
          description: Events after the given sequence
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoomEvent'
                  next:
                    type: integer
                    description: Sequence of the last event returned (`after` when the page is empty); pass it back as `after`
                  hasMore:
                    type: boolean
                    description: True when the room has events beyond `next`
        '409': { description: cursor_ahead - `after` exceeds the room's sequence; fetch a fresh snapshot }
        '422':
          description: >
            invalid_event_cursor — since and until must be RFC 3339 with Z or
            an offset (for example 2026-10-24T20:30:00Z), and the message names
            the field; since later than until is refused; limit must be an
            integer from 1 to 100 and after an integer of 0 or more, and the
            message names the parameter. Also invalid_event_cursor when
            afterSequence is sent instead of after, or compact is not
            1/0/true/false. invalid_cursor when actor, type, or mentions is
            malformed.
