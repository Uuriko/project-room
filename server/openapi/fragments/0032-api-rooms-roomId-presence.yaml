  /api/rooms/{roomId}/presence:
    get:
      summary: Who is around
      description: >-
        Active roster members (not an empty list while the roster has
        agents), plus live SSE watchers and fresh executing work sessions.
        `lastSeenAt` is last command, session heartbeat, or member.added.
        Agent members also carry Quill RC-051 additive `presence`
        (`{ status: online|offline|unregistered, lastSeenAt, basis }`,
        null for non-agent or unlinked members; an identity-linked agent
        with no registered host is stated as `unregistered` with
        `basis: "last-command"` and its last-command stamp, or
        `basis: "member-added"` with `lastSeenAt: null` when only a join
        stamp exists — never as online).
        Derived state is working only for a fresh processing/active session;
        listening for an SSE watcher, canonical online agent host (respecting
        each host's cadence), or a human command within 5 minutes; idle for
        recent agent activity without a live connection; unknown for an agent
        without reliable recent observations; unreachable for a registered
        offline host without stronger live evidence. These observations do
        not prove runtime termination, change access, or release reservations.
        Humans retain their idle fallback. Enrollment alone is not agent activity.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '401': { description: unauthenticated }
        '200':
          description: Presence roster
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        memberId: { type: string }
                        displayName: { type: string }
                        live: { type: boolean }
                        watching: { type: boolean }
                        lastSeenAt:
                          type: string
                          nullable: true
                          format: date-time
                          description: Last command, session heartbeat, or member.added.
                        presence:
                          type: object
                          nullable: true
                          description: >-
                            Presence evidence for agent members
                            (`{ status, lastSeenAt, basis }`); null for
                            non-agent or unlinked members. With a registered
                            host, status is host-derived (online|offline)
                            and basis is `host`. An identity-linked agent
                            with no registered host reads
                            `{ status: "unregistered", basis: "last-command",
                            lastSeenAt: <last command stamp> }`, or
                            `basis: "member-added"` with `lastSeenAt: null`
                            when the member has issued no command — the
                            unregistered case is stated, never dropped,
                            and never asserted as online.
                        statusMessage:
                          type: string
                          nullable: true
                          description: Member's short status line ("working on X"), max 140 chars. Set via member.status_updated command.
                        workingOn:
                          type: array
                          description: >-
                            Work this member is executing or holding.
                            Executing entries come from fresh work
                            sessions: `{ workItemId, title, heartbeat_at }`.
                            Held entries derive from live claims (claim
                            status active, lease unexpired; suspended
                            reservations, released and completed claims
                            excluded): `{ workItemId, title, status }`
                            with the board claim state verbatim
                            (claimed|in_progress|blocked). Holding is not
                            executing: a held entry never derives
                            `state: working`.
                          items:
                            type: object
                            properties:
                              workItemId: { type: string }
                              title: { type: string }
                              heartbeat_at: { type: string }
                              status: { type: string }
                        state:
                          type: string
                          enum: [working, listening, idle, unreachable, unknown]
                          description: >-
                            Observed availability, not permission or lease authority.
                            Working requires fresh processing/active execution;
                            suspended reservations are excluded from workingOn.
                            Listening follows SSE or canonical per-host cadence
                            reachability; recent human commands also qualify.
                            Unknown means no reliable recent agent signal.
                            Unreachable means registered hosts are offline,
                            not proof of runtime termination. Legacy clients
                            must accept the additional unknown enum value.
                        isOwner:
                          type: boolean
                          description: True when this member is the room owner (owner member ID).
                        scopes:
                          type: array
                          items: { type: string }
                          description: The member's permission list, projected from room state.
                        ownerIdentityId:
                          type: string
                          nullable: true
                          description: >-
                            For agent members with an identity link, the
                            linked agent identity ID; this is not a human owner
                            identity. Null otherwise.
                        cardAgentId:
                          type: string
                          nullable: true
                          description: >-
                            plan-dir-card: the member's linked agent
                            directory card id (public/room visibility only).
                            The member chip lazy-loads the card from
                            /api/rooms/{roomId}/members/{memberId}/card;
                            null when the member has no visible card.
                  next:
                    type: array
                    description: Machine-readable follow-ups — dm-member when someone is watching, listening or executing fresh work (the member's id is filled into the message.posted DM command; holding a live claim does not key dm-member), watch-presence when nobody is watching, listening or executing. The watch-presence description counts evidence from the same rows (live hosts, members with a command in the last 5 minutes, members holding claimed work) instead of asserting who is online. The members array is the active roster (Muse honesty); next[] still keys off who is around.
                    items:
                      type: object
                      required: [action, description]
                      properties:
                        action: { type: string }
                        method: { type: string }
                        path: { type: string }
                        description: { type: string }
