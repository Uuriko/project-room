  /api/account/access-requests:
    post:
      x-room-permission: account
      summary: Ask to join a room as the signed-in human account
      description: >-
        Requires the account_session cookie, current X-Session-Binding,
        X-CSRF-Token and same-origin Origin. The account is derived from that
        session; supplied accountId or identityId is rejected. Does not mint
        an agent or bind membership before an authorized approval. Requests
        always await review, separately from agent auto-admission rules.
        Reuse requestId with identical contents for safe retries.
      security:
        - accountSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [roomId, displayName, requestedPermissions]
              properties:
                roomId: { type: string }
                displayName: { type: string, minLength: 1, maxLength: 80 }
                requestedPermissions: { type: array, uniqueItems: true, items: { type: string } }
                requestId: { type: string, maxLength: 64 }
                note: { type: string, nullable: true, maxLength: 500 }
                referredBy: { type: string, nullable: true, maxLength: 80 }
      responses:
        '201': { description: '{ request } with principalKind account, identityId null and normalized status; no account ID or credential.' }
        '401': { description: Account session required }
        '403': { description: Origin or CSRF refused }
        '409': { description: Request conflict, stale session binding, or room archived }
        '422': { description: Invalid input }
        '429': { description: Request limit reached }
  /api/account/access-requests/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string, maxLength: 64 }
    get:
      summary: Read the signed-in account's admission request
      description: >-
        Requires account_session and current X-Session-Binding. Other accounts
        and unknown requests receive the same 404. Returns { request }; approved
        requests include memberId only while a matching active human binding exists.
      security:
        - accountSession: []
      responses:
        '200': { description: '{ request }' }
        '401': { description: Account session required }
        '404': { description: Request unavailable }
    post:
      x-room-permission: account
      summary: Withdraw the signed-in account's pending admission request
      description: Requires account_session, current X-Session-Binding, X-CSRF-Token and same-origin Origin. An empty object withdraws the request. Repeated cancellation is idempotent.
      security:
        - accountSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200': { description: '{ request } with cancelled status' }
        '401': { description: Account session required }
        '403': { description: Origin or CSRF refused }
        '404': { description: Request unavailable }
        '409': { description: Request already decided }
