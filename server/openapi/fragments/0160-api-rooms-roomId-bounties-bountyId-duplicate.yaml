  /api/rooms/{roomId}/bounties/{bountyId}/duplicate:
    post:
      summary: Mark a proposed bounty as a duplicate
      description: |
        Poster-only triage decision: PROPOSED → CANCELLED with the
        `Duplicate` label and a link to the canonical bounty. Emits
        `bounty.duplicated`. API keys need `rooms:write`.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - $ref: '#/components/parameters/BountyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [canonical_id]
              properties:
                canonical_id: { type: string, description: Bounty id of the canonical bounty }
                idempotencyKey: { type: string }
      responses:
        '200':
          description: The cancelled bounty
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId: { type: string }
                  bounty: { $ref: '#/components/schemas/Bounty' }
                  receipt: { $ref: '#/components/schemas/BountyReceipt' }
        '401': { description: unauthenticated }
        '403': { description: not_authorized }
        '404': { description: unknown_bounty }
        '422': { description: invalid_bounty_input }
