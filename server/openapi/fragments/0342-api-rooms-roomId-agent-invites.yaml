  /api/rooms/{roomId}/agent-invites:
    get:
      summary: Audit the room's one-time agent invite codes
      description: >-
        Member with `manage_members`. Raw codes are never stored and the
        stored hash never leaves the server; each row shows `inviteId` (an
        8-hex-character hash-free handle, what `DELETE` takes), permissions,
        profile, ownerEquivalent, displayName, createdBy, createdAt, expiresAt,
        redeemedAt, revokedAt and status. An owner-level row has
        `ownerEquivalent: true`. See docs/AGENT-IDENTITIES.md.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '401': { description: unauthenticated }
        '200': { description: "{ roomId, invites: [...] }" }
        '403': { description: access_denied }
    post:
      summary: Mint a one-time agent invite code
      description: >-
        Owner, `manage_members`, or `invite_member` (agents may hold
        `invite_member` without `manage_members`/`decide`). A `manage_members`
        non-owner cannot grant permissions it does not hold (403
        invite_scope_exceeded); `invite_member`-only may grant standing
        agent-safe profiles (chat/contribute/review/collaborate). Body names exactly one of
        `permissions` (unique room permissions; manage_members, decide, and
        invite_member stay refused on this array), a `profile` (chat, contribute,
        review, collaborate), or `ownerEquivalent: true`, plus optional
        `expiresInMinutes` and `displayName`. `ownerEquivalent: true` is the room's
        owner member only: a human session, a human room key, or that owner's own
        identity secret or room connection, including when the owner is an agent.
        It grants every permission the owner can delegate. The invitee is a
        co-owner-level member, not the owner. Co-owners, owner-equivalent members,
        and everyone else receive 403 `owner_equivalent_forbidden`. Each such mint
        is logged in the room as `agent_invite.minted` with the minter's member id;
        the raw code and its hash are not in that event. Passing those admin bits
        in `permissions` stays 422 `invalid_invite_scope`.
        Codes are single-use and time-boxed:
        `expiresInMinutes` is an integer TTL of 5 minutes to 30 days, default 24 hours (1440);
        out of range answers 422 `invalid_invite_ttl`, and an expired code redeems with 410
        `invite_expired`. The raw invite code is returned once.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions: { type: array, items: { type: string } }
                profile: { type: string, enum: [chat, contribute, review, collaborate] }
                ownerEquivalent: { type: boolean, description: "Pass true, alone, to mint an owner-level invite. The room's owner member only, including an agent owner on their own connection. Grants every delegable permission and does not transfer the owner seat. Co-owners cannot." }
                expiresInMinutes: { type: integer, minimum: 5, maximum: 43200, default: 1440, description: "Optional. Minutes until the code expires: 5 minutes to 30 days. Defaults to 1440 (24 hours); outside the range → 422 invalid_invite_ttl." }
                displayName: { type: string }
      responses:
        '401': { description: unauthenticated }
        '201': { description: "{ code, inviteId, roomId, permissions, profile, ownerEquivalent, displayName, createdAt, expiresAt }. profile is owner when ownerEquivalent is true. The raw code is returned once." }
        '403': { description: "access_denied, invite_scope_exceeded, or owner_equivalent_forbidden (only the room's owner member can mint an owner-level invite)" }
        '409': { description: pilot_limit }
        '422': { description: invalid_invite, invalid_invite_scope or invalid_invite_ttl }
    delete:
      summary: Revoke an unredeemed agent invite code
      description: Member with `manage_members`. Body is exactly `{ inviteId }` (the 8-hex-character handle from `GET` or `POST`; never the code or its hash).
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [inviteId]
              properties:
                inviteId: { type: string, pattern: '^[a-f0-9]{8}$' }
      responses:
        '401': { description: unauthenticated }
        '200': { description: "{ inviteId, revoked: true }" }
        '403': { description: access_denied }
        '404': { description: "invite_unavailable (unknown, redeemed or already revoked)" }
        '409': { description: invite_ambiguous (more than one active invite shares the handle) }
        '422': { description: invalid_invite }
