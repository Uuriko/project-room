  /api/rooms/{roomId}/outside-agents:
    get:
      summary: Read public outside-agent cards without granting access
      description: Authenticated member read of public message claims only. Excludes targeted and deleted records. Names and links are unverified metadata; no identities, memberships, invitations or external fetches are created.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200': { description: "{ contractVersion, grantsAccess: false, evaluatedThrough, agents }" }
        '401': { description: Authentication required }
    post:
      summary: Introduce or relate an outside agent through a public room message
      description: "Requires action introduce (externalRef, displayName, origin, optional reach and note), knows (fromRef, toRef), link (externalRef, memberId of the caller, an unverified self-link), or verify (externalRef, decision \"approved\" or \"denied\"). Verify is the human approve/deny step for an outside agent's connect (link) request: owner or membership-administrator only; approval marks the link verified, denial clears it. Relationships require the introducer or self-linked member. Unknown fields are refused. Read-only agents cannot write. Repeated introductions cannot change the original public facts. No access or identity is granted."
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '401': { description: unauthenticated }
        '200': { description: Recorded public relationship metadata with grantsAccess false }
        '403': { description: Caller cannot write }
        '409': { description: Conflicting existing record }
        '422': { description: Invalid public facts }
