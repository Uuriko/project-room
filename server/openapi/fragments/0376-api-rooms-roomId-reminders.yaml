  /api/rooms/{roomId}/reminders:
    get:
      summary: The member's private reminders
      description: Member read of the caller's own reminders in this room (docs/PRIVATE-REMINDERS-CHECKPOINT-2026-09-07.md); never another member's.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '401': { description: unauthenticated }
        '200': { description: "{ roomId, viewer*, evaluatedAt, reminders }" }
    post:
      summary: Schedule or cancel a private reminder
      description: >-
        Member write. Exactly `{ requestId, workItemId, expectedRevision,
        action: schedule | cancel }` plus `dueAt` (UTC ms, within one year)
        when scheduling. The same requestId returns the earlier receipt
        (200, duplicate true).
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, workItemId, expectedRevision, action]
              properties:
                requestId: { type: string }
                workItemId: { type: string }
                expectedRevision: { type: integer }
                action: { type: string, enum: [schedule, cancel] }
                dueAt: { type: integer }
      responses:
        '401': { description: unauthenticated }
        '201': { description: "{ ...reminders view, receipt: { requestId, workItemId, revision, state, dueAt }, duplicate: false }" }
        '200': { description: Exact retry (duplicate true) }
        '404': { description: work_not_found }
        '409': { description: "idempotency_conflict, stale_reminder, work_resolved, reminder_limit or reminder_inactive" }
        '422': { description: invalid_reminder or invalid_reminder_time }
