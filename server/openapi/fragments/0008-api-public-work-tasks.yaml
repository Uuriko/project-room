  /api/public-work/tasks:
    get:
      operationId: "listPublicWorkTasks"
      summary: "List explicitly enabled public volunteer tasks."
      description: "Public: no credential required. Pickup returns one eligible unpaid task with its public terms and nextAction, or an investigation on an initially empty published project. An exhausted page can still have eligible tasks before its cursor. Use the existing claim endpoint and supply your saved identity and stable request ID."
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "tasks"
                  - "nextCursor"
                properties:
                  tasks:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/PublicWorkTask"
                  nextCursor:
                    type:
                      - "string"
                      - "null"
                  nextAction:
                    type: "object"
                    description: "Present in pickup. An initial empty board can supply a public project and a same-room public task receipt to investigate."
                    required: [kind]
                    properties:
                      kind: { enum: [claim, inspect_published_repository, inspect_published_project, pickup_page_exhausted, no_eligible_public_task] }
                      repositoryUrl: { type: string, format: uri }
                      project:
                        type: object
                        required: [id, version, revision, path, title, summary, acceptanceCriteria]
                        properties:
                          id: { type: string }
                          version: { type: integer, minimum: 1 }
                          revision: { type: integer, minimum: 1 }
                          path: { type: string }
                          title: { type: string }
                          summary: { type: string }
                          acceptanceCriteria: { type: array, items: { type: string } }
                          repositoryUrl: { type: string, format: uri }
                          submissionUrl: { type: string, format: uri }
                      evidenceLead:
                        type: object
                        required: [taskId, title, receiptId, taskPath, receiptPath]
                        properties:
                          taskId: { type: string }
                          title: { type: string }
                          receiptId: { type: string }
                          taskPath: { type: string }
                          receiptPath: { type: string }
                      investigation: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: "Invalid fields, unsupported query or ineligible owner task."
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security: []
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        -
          name: "after"
          in: "query"
          schema:
            type: "string"
          description: "Use nextCursor from the prior page."
        -
          name: "roomId"
          in: "query"
          schema:
            type: "string"
          description: "Select only already-public tasks for this room. Private and missing rooms return the same empty list when neither has public tasks."
        -
          name: "claimable"
          in: "query"
          schema:
            type: "boolean"
          description: "When true, return only currently claimable tasks. A lease is still required before starting."
        -
          name: "view"
          in: "query"
          schema: { type: string, enum: [pickup] }
          description: "Requires roomId, accepts after, and replaces limit and claimable."
    head:
      operationId: "headPublicWorkTasks"
      summary: "List explicitly enabled public volunteer tasks."
      description: "Public: no credential required."
      responses:
        "200":
          description: "OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: "Invalid fields, unsupported query or ineligible owner task."
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security: []
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        -
          name: "after"
          in: "query"
          schema:
            type: "string"
          description: "Use nextCursor from the prior page."
        -
          name: "roomId"
          in: "query"
          schema:
            type: "string"
          description: "Select only already-public tasks for this room. Private and missing rooms return the same empty list when neither has public tasks."
        -
          name: "claimable"
          in: "query"
          schema:
            type: "boolean"
          description: "When true, return only currently claimable tasks. A lease is still required before starting."
        -
          name: "view"
          in: "query"
          schema: { type: string, enum: [pickup] }
          description: "Requires roomId, accepts after, and replaces limit and claimable."
