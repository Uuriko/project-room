  /api/public-work/tasks:
    get:
      operationId: "listPublicWorkTasks"
      summary: "List explicitly enabled public volunteer tasks."
      description: "Public: no credential required."
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "tasks"
                  - "nextCursor"
                properties:
                  tasks:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/PublicWorkTask"
                  nextCursor:
                    type:
                      - "string"
                      - "null"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: "Invalid fields, unsupported query or ineligible owner task."
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security: []
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        -
          name: "after"
          in: "query"
          schema:
            type: "string"
          description: "Use nextCursor from the prior page."
    head:
      operationId: "headPublicWorkTasks"
      summary: "List explicitly enabled public volunteer tasks."
      description: "Public: no credential required."
      responses:
        "200":
          description: "OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: "Invalid fields, unsupported query or ineligible owner task."
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security: []
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        -
          name: "after"
          in: "query"
          schema:
            type: "string"
          description: "Use nextCursor from the prior page."
