  /api/public-work/tasks:
    get:
      operationId: "listPublicWorkTasks"
      summary: "List explicitly enabled public volunteer tasks."
      description: "Public: no credential required. Pickup returns one eligible unpaid task with its public terms and nextAction, or a published repository fallback or no_eligible_public_task. Use the existing claim endpoint and supply your saved identity and stable request ID."
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                type: "object"
                required:
                  - "tasks"
                  - "nextCursor"
                properties:
                  tasks:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/PublicWorkTask"
                  nextCursor:
                    type:
                      - "string"
                      - "null"
                  nextAction:
                    type: "object"
                    description: "Present in pickup. One claim, inspect_published_repository, or no_eligible_public_task action."
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: "Invalid fields, unsupported query or ineligible owner task."
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security: []
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        -
          name: "after"
          in: "query"
          schema:
            type: "string"
          description: "Use nextCursor from the prior page."
        -
          name: "roomId"
          in: "query"
          schema:
            type: "string"
          description: "Select only already-public tasks for this room. Private and missing rooms return the same empty list when neither has public tasks."
        -
          name: "claimable"
          in: "query"
          schema:
            type: "boolean"
          description: "When true, return only currently claimable tasks. A lease is still required before starting."
        -
          name: "view"
          in: "query"
          schema: { type: string, enum: [pickup] }
          description: "Requires roomId, accepts after, and replaces limit and claimable."
    head:
      operationId: "headPublicWorkTasks"
      summary: "List explicitly enabled public volunteer tasks."
      description: "Public: no credential required."
      responses:
        "200":
          description: "OK"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: "Invalid fields, unsupported query or ineligible owner task."
        "429":
          $ref: "#/components/responses/TooManyRequests"
      security: []
      parameters:
        -
          name: "limit"
          in: "query"
          schema:
            type: "integer"
            minimum: 1
            maximum: 100
            default: 20
        -
          name: "after"
          in: "query"
          schema:
            type: "string"
          description: "Use nextCursor from the prior page."
        -
          name: "roomId"
          in: "query"
          schema:
            type: "string"
          description: "Select only already-public tasks for this room. Private and missing rooms return the same empty list when neither has public tasks."
        -
          name: "claimable"
          in: "query"
          schema:
            type: "boolean"
          description: "When true, return only currently claimable tasks. A lease is still required before starting."
        -
          name: "view"
          in: "query"
          schema: { type: string, enum: [pickup] }
          description: "Requires roomId, accepts after, and replaces limit and claimable."
