  /api/rooms/{roomId}/referrals:
    get:
      summary: Referral board (member)
      description: >-
        Any room member. Returns the referral board: referrals newest-first
        (referrer → referee joins with display names and the via path),
        a plain leaderboard ranked by successful referrals, and the caller's
        own referral rows and count. A referral counts only on actual join
        (invite redemption or approved access request); ids and display names
        only. With view=invitation, returns only the caller's own private
        invitation and any verification blocker, without loading the board
        or settling reward activations from message history. The invitation
        token grants its stated access and must not be logged or published.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - in: query
          name: view
          schema: { type: string, enum: [invitation] }
          description: Select only the invitation needed by the Invite dialog; omit for the full referral board.
      responses:
        '200':
          description: The room's referral board
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId: { type: string }
                  contractVersion: { type: integer, enum: [1], description: Present for the invitation-only view. }
                  invite: { type: object, nullable: true, description: Caller-owned invitation with token, hash, expiry, join limits, status and message. }
                  inviteBlocked: { type: string, enum: [email_unverified] }
                  referrals:
                    type: array
                    description: Newest first
                    items:
                      type: object
                      properties:
                        referrerMemberId: { type: string }
                        referrerDisplayName: { type: string }
                        refereeMemberId: { type: string }
                        refereeDisplayName: { type: string }
                        completedAt: { type: integer }
                        via: { type: string, enum: [invite, request] }
                  leaderboard:
                    type: array
                    description: Ranked by successful referrals, most first
                    items:
                      type: object
                      properties:
                        memberId: { type: string }
                        displayName: { type: string }
                        referralCount: { type: integer }
                  myReferralCount: { type: integer }
                  myReferrals:
                    type: array
                    items:
                      type: object
        '401': { description: unauthenticated (room membership required) }
