  /api/rooms/{roomId}/board/v2/events:
    get:
      summary: Read the board event log
      deprecated: true
      description: >
        Unified append-only event log (kinds: claim, heartbeat, release,
        receipt, note, finding, decision). Cursor pagination on seq:
        pass since_seq as the last seen seq; has_more says whether to ask again.
        Retired. Every authenticated board/v2 route returns 410
        board_v2_retired; next points at /api/rooms/{roomId}/work-claims.
      tags: [Board v2]
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: kind
          in: query
          schema:
            type: string
            enum: [claim, heartbeat, release, receipt, note, finding, decision]
        - name: lane
          in: query
          schema: { type: string }
        - name: since_seq
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '401': { description: unauthenticated }
        '410': { description: board_v2_retired }
        '200':
          description: Event page
          content:
            application/json:
              schema:
                type: object
                required: [watermark, events, has_more]
                properties:
                  watermark: { type: integer }
                  events: { type: array, items: { $ref: '#/components/schemas/BoardV2Event' } }
                  has_more: { type: boolean }
