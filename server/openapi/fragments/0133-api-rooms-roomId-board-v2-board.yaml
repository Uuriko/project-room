  /api/rooms/{roomId}/board/v2/board:
    get:
      summary: Read the board snapshot
      deprecated: true
      description: Watermark, claims, file-claims index, cross-lane overlaps, live decisions. Retired. Every authenticated board/v2 route returns 410 board_v2_retired; use the work-claims board.
      tags: [Board v2]
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: lane
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema:
            type: string
            enum: [submitted, working, suspended, cancelled, completed, released]
        - name: file
          in: query
          schema: { type: string }
        - name: since_seq
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '401': { description: unauthenticated }
        '410': { description: board_v2_retired }
        '200':
          description: Board snapshot
          content:
            application/json:
              schema:
                type: object
                required: [watermark, claims, file_claims, overlaps, decisions]
                properties:
                  watermark: { type: integer }
                  claims: { type: array, items: { $ref: '#/components/schemas/BoardV2Claim' } }
                  file_claims: { type: array, items: { $ref: '#/components/schemas/BoardV2FileClaims' } }
                  overlaps: { type: array, items: { $ref: '#/components/schemas/BoardV2FileClaims' } }
                  decisions: { type: array, items: { $ref: '#/components/schemas/BoardV2Decision' } }
