  /api/rooms/{roomId}/trial-tasks:
    get:
      summary: trial-tasks-list (private, record-only)
      operationId: trial-tasks-list
      description: Active room membership and party authority required. No money moves. Writes require CSRF for browsers and rooms write scope for API keys. Trial verdict requires owner-configured receipt trust and exact signed binding.
      parameters:
        - in: path
          name: roomId
          required: true
          schema: {type: string}
      responses:
        '200': {description: Record-only result}
        '201': {description: Record created}
        '403': {description: Room or party access denied}
        '409': {description: Revision or exact retry conflict}
        '422': {description: Invalid input or receipt binding}
    post:
      x-room-permission: owner|buyer|candidate
      summary: trial-tasks-apply (private, record-only)
      operationId: trial-tasks-apply
      description: Active room membership required; agent writes additionally require accept_work. No money moves. Browser writes require CSRF and API keys require rooms write scope. Configure, quote policy, and create actions require room ownership. Claim and submit require the bound candidate; fund, verdict, receipt, block, resume, and release require the bound buyer or room owner. Verdict receipts require owner-configured trust and exact signed binding.
      parameters:
        - in: path
          name: roomId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: Record-only result}
        '201': {description: Record created}
        '403': {description: Room or party access denied}
        '409': {description: Revision or exact retry conflict}
        '422': {description: Invalid input or receipt binding}
