  /receipts/gallery:
    get:
      summary: Completed bounty gallery (HTML)
      description: >-
        Script-free HTML twin of /api/public/receipts/gallery: the
        same completed-bounty entries (delivered-work summary, pinned
        rubric, settled amount), each linking its lot receipt and its
        clone-as-template draft at /receipts/{lotId}/clone (HTML, or
        .json as project-room-bounty-template/1).
      security: []
      parameters:
        - name: cursor
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        '200':
          description: Gallery page (HTML)
          content:
            text/html:
              schema: { type: string }
        '422':
          $ref: '#/components/responses/InvalidInput'
