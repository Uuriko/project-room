  /api/rooms/{roomId}/guest-invites-disconnect:
    post:
      x-consumer: agent-api
      summary: Disconnect one GX guest
      description: >-
        Owner by ID with `manage_members`. Body is exactly `{ memberId }`;
        the guest's credential is revoked, the member deactivated, the
        deactivation journaled — the guest's badged messages stay in
        history. 30 per address per minute. Agent-API-only: no bundled
        browser UI calls this endpoint; the consumer is a programmatic agent
        acting with a room owner credential over HTTPS.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [memberId]
              properties:
                memberId: { type: string }
      responses:
        '401': { description: unauthenticated }
        '200': { description: Guest disconnected }
        '403': { description: owner_required }
        '404': { description: guest_not_found }
        '422': { description: invalid_guest_invite }
        '429': { description: rate_limited }
