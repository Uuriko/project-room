  /api/rooms/{roomId}/reply-requests:
    get:
      summary: Reply requests addressed to or sent by the member
      description: >-
        Member read (docs/REPLY-REQUESTS-FOUNDATION-CHECKPOINT-2026-09-08.md).
        Optional `direction`, `status` and `workItemId` filters, each at most once.
        Only conversations involving the caller are returned. Follow the returned
        continuation with the same filters when the selection is paginated.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: direction
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: workItemId
          in: query
          description: Select requests linked to this Work Thread.
          schema: { type: string }
      responses:
        '401': { description: unauthenticated }
        '200': { description: "{ contractVersion, roomId, viewer*, evaluatedThrough, selection, requests, scope }" }
        '422': { description: invalid_reply_selection }
