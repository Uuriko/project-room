  /api/rooms/{roomId}/spend-grants/{agentId}:
    delete:
      summary: Revoke an agent's spend grant
      description: >-
        Spend-primitive MVP. Owner or grants:issue delegate only. Stamps
        revoked_at on the capability="spend" edge; the agent keeps nothing
        for future calls. Idempotent: revoking an absent grant still returns
        200 with revoked false.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: agentId
          in: path
          required: true
          schema: { type: string }
      responses:
        '401': { description: unauthenticated }
        '200':
          description: Revocation receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId: { type: string }
                  agentId: { type: string }
                  revoked: { type: boolean }
                  evaluatedThrough: { type: integer }
        '403': { description: owner_required }
