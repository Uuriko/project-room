  /api/rooms/{roomId}/work-claims/{claimId}/cancel:
    post:
      x-room-permission: claim_owner|owner|manage_claims
      summary: Cancel a work claim
      description: |
        Whoever created the item while it is still unclaimed, its holder,
        the room owner, or a member with manage_claims withdraws an open
        item. Same terminal `closed` state as close; the history entry is
        `cancelled`. MCP: room_close_work_claim with verb cancel.
        API keys need `rooms:write`.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                reason: { type: string, maxLength: 4000, description: Why the item was retired. Recorded on the history entry. }
      responses:
        '200':
          description: The closed item (state closed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkClaim'
        '401': { description: unauthenticated }
        '403': { description: work_not_owner, work_claims_not_permitted, insufficient_scope (API key without rooms:write), guest_scope_denied, not_member, or agent_readonly }
        '404': { description: work_claim_not_found }
        '409': { description: work_claim_terminal (already done or closed), or room_event_budget_low }
        '422': { description: invalid_claim_input }
        '429': { description: Rate limit exceeded (rate_limited). }
