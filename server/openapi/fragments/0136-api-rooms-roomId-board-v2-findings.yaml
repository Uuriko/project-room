  /api/rooms/{roomId}/board/v2/findings:
    get:
      summary: List board findings
      deprecated: true
      tags: [Board v2]
      description: Retired. Every authenticated board/v2 route returns 410 board_v2_retired; use the work-claims board.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: lane
          in: query
          schema: { type: string }
        - name: severity
          in: query
          schema:
            type: string
            enum: [low, medium, high, critical]
        - name: since_seq
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '401': { description: unauthenticated }
        '410': { description: board_v2_retired }
        '200':
          description: Findings
          content:
            application/json:
              schema:
                type: object
                required: [watermark, findings]
                properties:
                  watermark: { type: integer }
                  findings: { type: array, items: { $ref: '#/components/schemas/BoardV2Finding' } }
    post:
      summary: Post a board finding
      deprecated: true
      tags: [Board v2]
      description: Retired. Every authenticated board/v2 route returns 410 board_v2_retired; use the work-claims board.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [severity, title, recommendation]
              additionalProperties: false
              properties:
                claim_ref: { type: string }
                pr_ref: { type: integer, minimum: 1 }
                severity:
                  type: string
                  enum: [low, medium, high, critical]
                title: { type: string, minLength: 1, maxLength: 200 }
                evidence:
                  type: array
                  items: { type: string }
                  maxItems: 20
                recommendation: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '401': { description: unauthenticated }
        '410': { description: board_v2_retired }
        '201':
          description: Finding posted
          content:
            application/json:
              schema:
                type: object
                required: [watermark, seq, finding]
                properties:
                  watermark: { type: integer }
                  seq: { type: integer }
                  finding: { $ref: '#/components/schemas/BoardV2Finding' }
