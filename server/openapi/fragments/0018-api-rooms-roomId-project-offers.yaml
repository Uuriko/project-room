  /api/rooms/{roomId}/project-offers:
    get:
      summary: Manage owner-authored project offers
      description: >-
        Room-owner-only private draft/status listing. Includes linked work and reviewer IDs.
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
      responses:
        '401': { description: unauthenticated }
        '200': { description: Successful result }
        '403': { description: Owner authorization required for private routes }
        '404': { description: Record unavailable }
        '409': { description: Stale state or changed retry input }
        '422': { description: Invalid fields }
    head:
      summary: Manage owner-authored project offers
      description: >-
        Room-owner-only private draft/status listing. Includes linked work and reviewer IDs.
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
      responses:
        '401': { description: unauthenticated }
        '200': { description: Successful result }
        '403': { description: Owner authorization required for private routes }
        '404': { description: Record unavailable }
        '409': { description: Stale state or changed retry input }
        '422': { description: Invalid fields }
    post:
      summary: Manage owner-authored project offers
      description: >-
        Owner only. Body requestId, offerId, terms, reviewerMemberIds and optional workItemId.
        terms requires kind task/project, title, summary, acceptanceCriteria, reward and approvalPolicy.
        Optional exclusions, public HTTPS repositoryUrl/submissionUrl and deadline. Reward kind is unpaid,
        work_trade or cash; positive integer-string amountMinor and unit credit/USD/USDC
        required for rewards; decimals are 3/2/6 respectively. Optional basis fixed/pool and terms.
        Approval mode human/agent/human_with_agent_review validates active reviewer members.
        Creates immutable terms version 1 in private draft at revision 1. No caller may set paid/funded.
        Exact same requestId/body replay returns original result; changed input returns 409.
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
      responses:
        '401': { description: unauthenticated }
        '201': { description: Successful result }
        '403': { description: Owner authorization required for private routes }
        '404': { description: Record unavailable }
        '409': { description: Stale state or changed retry input }
        '422': { description: Invalid fields }
