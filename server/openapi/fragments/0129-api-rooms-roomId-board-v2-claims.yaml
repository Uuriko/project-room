  /api/rooms/{roomId}/board/v2/claims:
    get:
      summary: List board claims
      deprecated: true
      description: >
        Authenticated members list board claims with optional lane/state/file
        filters. Responses are paginated on the board watermark.
        Retired. Every authenticated board/v2 route returns 410
        board_v2_retired. next points at /api/rooms/{roomId}/work-claims.
        The board_vtwo_* tables are not dropped.
      tags: [Board v2]
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: lane
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema:
            type: string
            enum: [submitted, working, suspended, cancelled, completed, released]
        - name: file
          in: query
          schema: { type: string }
        - name: since_seq
          in: query
          schema: { type: integer, minimum: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '401': { description: unauthenticated }
        '410': { description: board_v2_retired }
        '200':
          description: Claims snapshot
          content:
            application/json:
              schema:
                type: object
                required: [watermark, claims, file_claims, overlaps, decisions]
                properties:
                  watermark: { type: integer }
                  claims: { type: array, items: { $ref: '#/components/schemas/BoardV2Claim' } }
                  file_claims: { type: array, items: { $ref: '#/components/schemas/BoardV2FileClaims' } }
                  overlaps: { type: array, items: { $ref: '#/components/schemas/BoardV2FileClaims' } }
                  decisions: { type: array, items: { $ref: '#/components/schemas/BoardV2Decision' } }
    post:
      summary: Submit a board claim
      deprecated: true
      description: >
        Claims files for a task with a lease (lease=<N>h, 1<=N<=72). The claim
        lane always comes from the authenticated member. A file overlap with a
        live claim from another lane is rejected with claim_conflict. Optional
        Idempotency-Key makes the write replay-safe per lane for 24h.
        Retired. Every authenticated board/v2 route returns 410
        board_v2_retired; next points at /api/rooms/{roomId}/work-claims.
      tags: [Board v2]
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [task_id, files, lease, reason]
              additionalProperties: false
              properties:
                task_id:
                  type: string
                  pattern: '^RC-\d{4}-\d{2}-\d{2}-\d+$'
                  description: >
                    Task id, RC-YYYY-MM-DD-NNN. A task-id never gets a second
                    claimant: reuse is 409 duplicate_task.
                files:
                  type: array
                  items: { type: string }
                  minItems: 1
                  maxItems: 100
                lease:
                  type: string
                  pattern: '^lease=[1-9]\d*h$'
                  description: Lease grammar lease=<N>h with 1<=N<=72.
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
      responses:
        '401': { description: unauthenticated }
        '410': { description: board_v2_retired }
        '201':
          description: Claim submitted
          content:
            application/json:
              schema:
                type: object
                required: [watermark, seq, claim]
                properties:
                  watermark: { type: integer }
                  seq: { type: integer }
                  claim: { $ref: '#/components/schemas/BoardV2Claim' }
        '409':
          description: duplicate_task or claim_conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Invalid fields
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
