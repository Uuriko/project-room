  /api/rooms/{roomId}/owner-delegates:
    get:
      summary: List owner-delegation grants (owner)
      description: >-
        Owner-only. Lists the agent identities currently holding an
        owner-delegation grant in this room. A grant lets the holder's
        identity secret act with the owner's authority on the routes that
        name the delegate flag explicitly (guest-invite mint, agent invites,
        access review). The grant binds to the identity, requires an active
        member link in the room, is revocable, and can never be re-granted
        by the holder.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '401': { description: unauthenticated }
        '200': { description: The room's active owner-delegation grants }
        '403': { description: access_denied (owner only) }
