  /api/rooms/{roomId}/board/v2/claims/{taskId}/release:
    post:
      summary: Release a claim
      deprecated: true
      description: Releases a live claim held by the authenticated lane; the claim becomes released. Retired. Every authenticated board/v2 route returns 410 board_v2_retired; use the work-claims board.
      tags: [Board v2]
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '401': { description: unauthenticated }
        '410': { description: board_v2_retired }
        '200':
          description: Claim released
          content:
            application/json:
              schema:
                type: object
                required: [watermark, seq, claim]
                properties:
                  watermark: { type: integer }
                  seq: { type: integer }
                  claim: { $ref: '#/components/schemas/BoardV2Claim' }
