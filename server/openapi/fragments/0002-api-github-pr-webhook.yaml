  /api/github/pr-webhook:
    post:
      x-room-permission: webhook_signature
      summary: Receive an authenticated GitHub pull request delivery
      description: Disabled by default (404). Requires configured HMAC secret and valid x-hub-signature-256 when enabled. No execution or review permission is granted.
      responses:
        '200': { description: Minimal link or settlement receipt }
        '401': { description: Invalid HMAC signature }
        '404': { description: Receiver disabled }
        '413': { description: Delivery too large }
        '503': { description: Enabled without a configured secret }
