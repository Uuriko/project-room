  /api/rooms/{roomId}/work-claims/{claimId}:
    get:
      summary: Read one work claim
      description: Any room member may read; API keys need `rooms:read`.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The work claim item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkClaim'
        '401': { description: unauthenticated }
        '403': { description: insufficient_scope (API key without rooms:read) or access_denied (bearer account sessions are not accepted) }
        '404': { description: work_claim_not_found }
        '422': { description: "invalid_claim_input — the claim id must match [A-Za-z0-9_-]{1,128}" }
        '429': { description: Rate limit exceeded (rate_limited). }
