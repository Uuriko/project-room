  /api/rooms/{roomId}/squads/{squadId}/members:
    post:
      x-room-permission: squad_owner|self
      summary: Update the squad roster
      description: |
        plan-squads. Only the squad owner may add members or remove other
        members; any member may remove themselves. The owner cannot be
        removed from an active squad. Added members must be active room
        members.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: squadId
          in: path
          required: true
          schema: { type: string }
          description: Squad id or squad name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                add: { type: array, items: { type: string } }
                remove: { type: array, items: { type: string } }
      responses:
        '200':
          description: Updated squad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SquadResult'
        '401':
          description: No room credential, or membership ended (unauthenticated)
        '403':
          description: Only the squad owner manages the roster (squad_owner_required)
        '404':
          description: No such squad in this room (squad_not_found)
        '422':
          $ref: '#/components/responses/InvalidInput'
