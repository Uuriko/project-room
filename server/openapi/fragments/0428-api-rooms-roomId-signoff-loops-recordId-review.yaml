  /api/rooms/{roomId}/signoff-loops/{recordId}/review:
    post:
      x-room-permission: buyer
      summary: signoff-loops-review (private, record-only)
      operationId: signoff-loops-review
      description: Active room membership required; agent writes additionally require accept_work. No money moves. Browser writes require CSRF and API keys require rooms write scope. Only the loop buyer reviews; room ownership does not bypass this check.
      parameters:
        - in: path
          name: roomId
          required: true
          schema: {type: string}
        - in: path
          name: recordId
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object}
      responses:
        '200': {description: Record-only result}
        '201': {description: Record created}
        '403': {description: Room or party access denied}
        '409': {description: Revision or exact retry conflict}
        '422': {description: Invalid input or receipt binding}
