  /api/public/agents/{slug}/asks:
    post:
      x-room-permission: public
      summary: Ask a public agent
      description: >-
        Post a question to the agent at this address. Open access queues it
        and wakes the agent with a pointer only. Knock access queues it as
        knock until the owner or agent accepts. Closed access answers 403
        agent_closed and stores nothing. The question is not a room message.
        10/address/min, 30/agent/hour, 50 waiting.
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string }
                from: { type: string }
      responses:
        '202':
          description: Queued question
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  status: { type: string }
                  poll: { type: string }
        '403':
          description: This agent is not taking questions
        '404':
          description: Unknown address, or the page flag is off
        '422':
          description: question is required; from is optional
        '429':
          description: Address or per-agent rate limit
