  /api/rooms/{roomId}/work-context:
    get:
      summary: Read one work item
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: workItemId
          in: query
          required: true
          schema: { type: string }
        - name: includeSource
          in: query
          schema: { type: boolean, default: false }
        - name: sourceObservation
          in: query
          description: JSON observation from an earlier includeSource read of this work and viewer. Requires includeSource=true. Fields roomId, workItemId, viewerId, messageId, revision (nonnegative safe integer), sha256 (lowercase hex). Maximum 1024 characters.
          schema: { type: string, maxLength: 1024 }
      responses:
        '401': { description: unauthenticated }
        '200':
          description: |
            Work context. Includes `accessSummary` (version 1): the read-only
            "what this agent can access" preview - conversation scope and the
            linked source message id (never its thread, replies, quoted mentions
            or imported excerpts), current evidence references and versions
            (not retrieved), the declared session budget with undeclared bounds
            as "unknown", participant ids, and the same `omitted` list as
            `context.omitted`. It lists nothing the caller cannot already read
            through this view and grants nothing. Replaced work includes
            `next.replacement`: a one-hop status (available or unavailable),
            workItemId, and a room_read_work nextRead pointer when available.
            Target content is not included; following it rechecks access.
            No approval or assignment transfers, and chains are not traversed.
            Opt-in source reads include a scoped content observation and freshness
            observed, changed, unchanged or unavailable. A matching observation
            returns source.status not_modified with message null; changed reads
            include the current body. Unavailable sources reveal no observation.
            Observations are content comparisons, not access grants. Briefs omit bodies.
            See docs/WORK-CONTEXT.md.
        '404': { $ref: '#/components/responses/NotFound' }
