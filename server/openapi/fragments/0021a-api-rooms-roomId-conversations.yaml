  /api/rooms/{roomId}/conversations:
    get:
      summary: List the caller's private conversation partners
      description: |
        Bounded metadata directory independent of the loaded conversation window.
        Returns memberId and lastMessageAt only, never message bodies or other
        members' private relationships. Caller visibility and history floors apply
        before grouping and pagination. Partners are ordered by member ID.
        Encrypted cursors bind the viewer, credential, session, limit and room head.
        A changed head or invalid cursor returns mode=reset with an empty list;
        restart without the cursor. Restarted services invalidate old cursors.
        Maximum 100 entries per page. This bounds returned metadata, not SQL scan
        cost: uncertified legacy rooms still inspect their projection in SQLite.
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200': { description: Viewer-bound directoryVersion 1 with mode, sequence, peers and nextCursor }
        '401': { description: Credential expired or revoked }
        '403': { description: Current membership or rooms read scope required }
        '422': { description: Invalid selection }
