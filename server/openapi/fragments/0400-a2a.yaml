  /a2a:
    post:
      operationId: a2aSendMessage
      summary: A2A JSON-RPC
      description: |
        message/send and SendMessage answer with how to join. No credentials
        and no room data. Invalid JSON is 400 JsonRpcError (error.code -32700)
        with no error.data. Same handler at /room/a2a.
      security: []
      responses:
        '200': { description: JSON-RPC result, or a JSON-RPC error object for a well-formed request the method cannot complete. }
        '400':
          description: Invalid JSON. Body is JsonRpcError (error.code -32700). Not the canonical error envelope.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonRpcError"
