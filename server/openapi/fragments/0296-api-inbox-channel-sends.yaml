  /api/inbox/channel-sends:
    post:
      summary: Dispatch or reconcile a queued Inbox reply through the channel transport
      description: |
        Reply from the Inbox (docs/UNIFIED-INBOX.md, "Send"). Account-session
        route with CSRF (`protectWrite`), 30 per minute per account. The
        attempt must already exist in the send journal (`send.reserve` over
        POST /api/inbox/commands). The server picks the transport for the
        source's connection: the live Telegram `sendMessage` transport when
        TELEGRAM_BOT_TOKEN and TELEGRAM_WEBHOOK_SECRET are set, otherwise an
        inert fixture sender that answers "accepted" without leaving the
        process. `dispatch` moves queued -> unknown -> accepted | rejected
        (or leaves unknown when Telegram is unreachable); `reconcile` replays
        the recorded receipt for an unknown or accepted attempt; `flush` retries an
        attempt stuck at unknown for more than 30 seconds (reconcile first, then
        resubmit only when the provider has no record, with the original
        operationId; any other status is returned unchanged, and a resubmit
        spends one send budget token). Email sources,
        samples and disconnected connections have no transport. The same
        `channelSend` descriptor (and `simulationAvailable`) is returned by
        GET /api/inbox/sources/{id}/sends and /send-context so the browser
        knows which transport, if any, applies before it offers a reply.
      security:
        - accountSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, sourceId, sendId]
              properties:
                action: { type: string, enum: [dispatch, reconcile, flush] }
                sourceId: { type: string }
                sendId: { type: string }
      responses:
        '200':
          description: The source's send list, the attempt, the transport descriptor and the connection's last send result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  contractVersion: { type: integer, enum: [1] }
                  viewer: { type: object }
                  sourceId: { type: string }
                  sends: { type: array, items: { type: object, description: "Send journal entry (id, sourceId, revision, status, envelope, providerId, createdAt, updatedAt)" } }
                  send: { type: object, description: The attempt after this call }
                  simulationAvailable: { type: boolean }
                  channelSend: { $ref: '#/components/schemas/ChannelSendDescriptor' }
                  lastSendResult:
                    type: [object, 'null']
                    properties:
                      at: { type: string, format: date-time }
                      outcome: { type: string, enum: [accepted, rejected, failed] }
                      code: { type: [string, 'null'], description: "fixture, network, rate_limited, server_error, unauthorized or the slugged Telegram description" }
        '401': { description: account_session_required }
        '403': { description: csrf_denied or origin_denied }
        '404': { description: inbox_source_not_found or inbox_send_not_found }
        '409': { description: "channel_sending_unavailable (no transport for this source), channel_connection_unavailable (Telegram refused the bot token), inbox_transport_mismatch" }
        '422': { description: invalid_inbox_send }
        '429': { description: rate_limited }
