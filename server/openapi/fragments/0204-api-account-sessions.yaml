  /api/account/sessions:
    get:
      summary: List the account's live account sessions
      description: |
        CX4. Account-session read (account_session cookie plus
        X-Session-Binding). One entry per live account-session slot the
        account holds — browser sessions and native (desktop) sessions
        alike, because the native desktop exchange retires its OAuth grant
        at redemption and keeps only the slot; those sessions never appear
        in /api/oauth/sessions. Each entry names the login method recorded
        at sign-in (a desktop session says method "desktop"), the slot's
        creation time, its authenticated-until and expiry, and whether it
        is the caller's own current session. A caller only ever sees their
        own sessions.
      security:
        - accountSession: []
      responses:
        '200':
          description: "{ sessions: [{ id, method, methodRef, createdAt, authenticatedUntil, expiresAt, current }] }"
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      required: [id, createdAt, authenticatedUntil, expiresAt, current]
                      properties:
                        id: { type: string, description: "Public session id (the :id for DELETE /api/account/sessions/{id}); a one-way derivation, never a credential" }
                        method: { type: [string, "null"], description: "Login method kind recorded at sign-in (desktop, magic, password, passkey, google, access-key, ...); null for sessions minted before methods were recorded" }
                        methodRef: { type: [string, "null"], description: "Public login-method handle recorded at sign-in, when the method carries one" }
                        createdAt: { type: integer, description: "Slot creation, ms epoch" }
                        authenticatedUntil: { type: integer, description: "End of the authenticated window, ms epoch" }
                        expiresAt: { type: integer, description: "Slot expiry, ms epoch" }
                        current: { type: boolean, description: "True for the caller's own session" }
        '401': { description: unauthenticated }
        '422': { description: session_binding_required }
        '429': { description: rate_limited }
