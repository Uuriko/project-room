  /api/rooms/{roomId}/access-requests/{requestId}/decide:
    post:
      summary: Decide a join or permission request
      description: >-
        Uses current membership-administration authority and ordinary room
        write authentication. A join approval links the identity as a member.
        A permission approval requires manage_members, and a non-owner
        administrator may grant only permissions they currently hold. Omit
        permissions to approve the requested list, or supply a selected list
        for a partial grant. Approval unions the selected permissions with
        existing permissions; denial never changes membership or permissions.
        If membership or its request history changed, approval returns
        stale_membership instead of restoring access: review current access
        and file a fresh request. Permission decisions atomically record a
        room message and requester notification. Repeating a decision returns
        already_decided without duplicating the grant or message. Optional
        decision notes stay in the request record and are not copied into the
        public outcome message. Scoped API keys require rooms:write.
      security:
        - bearerAuth: []
        - roomSession: []
        - accountSession: []
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - { name: requestId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, deny] }
                permissions:
                  type: array
                  items: { $ref: '#/components/schemas/RequestedRoomPermission' }
                note: { type: [string, 'null'], maxLength: 500 }
      responses:
        '401': { description: unauthenticated }
        '200':
          description: Decided request, with effective grantedPermissions on approval and a decisionMessageId for permission decisions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomPermissionRequestRecord'
        '403': { description: access_denied (including a named permission the reviewer lacks), insufficient_scope, or csrf_denied }
        '404': { description: not_found }
        '409': { description: already_decided or stale_membership; current room write policy may also refuse the decision }
        '422': { description: invalid_request }
  # JDOT-MEMBER-PERMS end
