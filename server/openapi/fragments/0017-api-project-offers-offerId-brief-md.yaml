  /api/project-offers/{offerId}/brief.md:
    get:
      summary: Read published project offers
      security: []
      description: >-
        Published offer only; drafts, withdrawn offers and archived-room offers return 404.
        No query parameters accepted. Public terms retain full acceptance criteria.
        The Markdown brief is derived from the same record and grants no permissions.
        Cash funding/payment remains not_configured; internal credit is ledger_only and has no cash value.
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Successful result }
        '403': { description: Owner authorization required for private routes }
        '404': { description: Record unavailable }
        '409': { description: Stale state or changed retry input }
        '422': { description: Invalid fields }
