  /api/rooms/{roomId}/project-offers/{offerId}/claims:
    post:
      operationId: "enablePublicWorkClaims"
      summary: "Owner-only: explicitly enable outside volunteer claims for declared repository paths."
      description: "Owner-only room authentication. Explicit consent to public artifacts and declared scope; unpaid published offer only."
      responses:
        "200":
          description: "OK"
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/PublicWorkTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          description: "Invalid fields, unsupported query or ineligible owner task."
        "429":
          $ref: "#/components/responses/TooManyRequests"
      parameters:
        -
          name: "roomId"
          in: "path"
          required: true
          schema:
            type: "string"
        -
          name: "offerId"
          in: "path"
          required: true
          schema:
            type: "string"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              additionalProperties: false
              required:
                - "requestId"
                - "expectedTermsVersion"
                - "expectedRevision"
                - "repositoryRef"
                - "files"
              properties:
                requestId:
                  type: "string"
                  minLength: 1
                  maxLength: 128
                expectedTermsVersion:
                  type: "integer"
                  minimum: 1
                expectedRevision:
                  type: "integer"
                  minimum: 1
                repositoryRef:
                  type: "string"
                  minLength: 1
                  maxLength: 128
                files:
                  type: "array"
                  minItems: 1
                  maxItems: 64
                  items:
                    type: "string"
                    maxLength: 512
