  /api/rooms/{roomId}/work-claims/{claimId}/provenance:
    get:
      summary: Walk the claim provenance graph
      description: |
        Returns every claim that builds on this claim directly or
        transitively through `parentClaimId` edges, breadth-first with
        `depth`, plus each node's state, owner and title. Cycle-safe and
        capped at 200 nodes (`truncated: true` when the cap binds).
        Read-only; any room member may walk. MCP parity:
        `room_work_claim_provenance`.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The downstream provenance graph
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId: { type: string }
                  claimId: { type: string }
                  root: { type: string }
                  rootState: { type: string }
                  rootOwner: { type: [string, 'null'] }
                  rootTitle: { type: string }
                  truncated: { type: boolean }
                  downstream:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        depth: { type: integer }
                        state: { type: string }
                        owner: { type: [string, 'null'] }
                        title: { type: string }
        '401': { description: unauthenticated }
        '403': { description: not_member, insufficient_scope (API key without rooms:read), or access_denied (bearer account sessions are not accepted) }
        '404': { description: work_claim_not_found }
        '422': { description: "invalid_claim_input — the claim id must match [A-Za-z0-9_-]{1,128}" }
        '429': { description: Rate limit exceeded (rate_limited). }
    head:
      operationId: "headClaimProvenance"
      summary: Provenance walk headers without the graph body
      description: |
        Same authorization and status coverage as GET, headers only.
        Read-only; any room member may walk. MCP parity:
        `room_work_claim_provenance`.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: claimId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Provenance graph headers without a body }
        '401': { description: unauthenticated }
        '404': { description: work_claim_not_found }
