  /api/rooms/{roomId}/spend-grants:
    post:
      summary: Issue a per-agent spend grant
      description: >-
        Spend-primitive MVP. Owner or grants:issue delegate only; a delegate
        can never self-issue (403 spend_grant_self_issue_forbidden) while the
        owner keeps full authority. Issues or replaces the capability="spend" grant edge for
        one agent member: capCents (integer cents as a string, the grant's
        lifetime ceiling), perTxCapCents (per-call ceiling), optional
        expiresAt (epoch ms). t1_readonly and guest agents cannot hold spend
        grants (403). Priced MCP tools (room_put_file 5c, bounty_post 10c,
        add_land_item 1c) charge-then-forward against the grant: no headroom
        means an honest 402 payment_required and the tool never runs.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId, capCents, perTxCapCents]
              additionalProperties: false
              properties:
                agentId: { type: string }
                capCents: { type: string, pattern: '^(0|[1-9][0-9]{0,8})$' }
                perTxCapCents: { type: string, pattern: '^(0|[1-9][0-9]{0,8})$' }
                allowlist: { type: ['array', 'null'], items: { type: string } }
                singleUse: { type: boolean }
                expiresAt: { type: integer, minimum: 1 }
      responses:
        '401': { description: unauthenticated }
        '201':
          description: Grant issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  roomId: { type: string }
                  agentId: { type: string }
                  spend:
                    type: object
                    properties:
                      denomination: { type: string }
                      capCents: { type: string }
                      perTxCapCents: { type: string }
                      remainingCents: { type: string }
                      expiresAt: { type: [integer, 'null'] }
                      allowlist: { type: ['array', 'null'], items: { type: string } }
                      singleUse: { type: boolean }
                  evaluatedThrough: { type: integer }
        '403': { description: owner_required }
        '422': { description: invalid_spend_grant }
