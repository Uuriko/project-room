  /api/rooms/{roomId}:
    get:
      summary: Room snapshot
      description: >-
        Current projection for a member: `{ roomId, sequence, state, charter,
        cursor, catchUpCursor, viewerId, ... }`. `cursor` is the stored
        caught-up marker that event resume starts from. `catchUpCursor` (full
        view) is the read-only Catch up boundary: that marker moved past the
        viewer's own unbroken run of events, the same boundary the return
        brief uses. Reading it never writes a marker. `?view=work` returns the
        work-focused snapshot (`snapshotView`, `snapshotVersion`). Normalized
        work and orientation views return version 2 with at most four exact
        current task records, viewer-scoped private definitions and `workWindow`.
        Its `hasMore`, encrypted `nextCursor` and exact `nextRead.path` continue
        the source using `work_cursor`; absence from a page is not absence from
        the room. Source change or process restart invalidates the cursor.
        Legacy work/orientation remain version 1. Header
        `x-project-room-help-context: 1` (with `view=work`) adds help
        context; `x-project-room-offer-context: 1` (full view only) adds
        offer context. Room routes accept a room bearer key, a browser room
        session, or a signed-in account session with `?auth=account`.
        `?view=orientation` returns `snapshotView: orientation`, version 1,
        with room metadata, members, current work records and bounded handoff
        history for default agent orientation. Full nested current evidence
        records are retained; messages, event history, prior receipts/checks,
        halts and read markers are omitted. It accepts no context headers.
        The default full-view read and `?messages=recent` (no other filters)
        are the same window: the newest 100 visible messages that fit the
        byte budget, in `state.messages`, plus `messagesWindow`
        `{ mode: recent, limit, omitted, older: conversation }` and
        `messagesPage` `{ before, hasMore }`. Older messages are
        `GET /api/rooms/{roomId}/messages?before={messagesPage.before}`.
        `?full=1` is the retired unbounded document. It is refused unless
        the server runs with `ROOM_SNAPSHOT_FULL_COMPAT=1`, and then the
        response sets `Deprecation: true`.
        The optional `x-project-room-audit-view: activity-v1` header on
        the window preserves decision/work/claim activity from the same
        audit tail while omitting other audit events (messages still
        appear in the projection). The response declares
        `auditView: activity` and `auditVersion: 1`. Omit the header for
        the default audit tail. Older servers may ignore it.
        `?view=identity` returns `snapshotView: identity`, `snapshotVersion: 1`,
        roomId, viewer identity/session binding fields, and only
        `state.room.ownerId` plus the authenticated member's id, kind, active,
        revision, permissions and delegatedAdmin flag. It includes no history,
        other members or work. It performs fresh authorization on each read;
        it is not a cached grant for a later operation. Context/audit headers
        and other query filters cannot be combined with this view.
        `?view=authority&memberId=...` returns `snapshotView: authority`,
        version 1, with the authenticated caller, owner and at most 64 selected
        member IDs. Repeated `memberId` selects are deduplicated. Only current
        id/kind/active/revision/identity/account/accountable-human fields are
        returned, never message history, work bodies or a full roster. Records
        are verified before field selection. `authoritySelection` reports the
        exact requested IDs, `complete: true`, and `unresolvedMemberIds`;
        unresolved does not assert absence or revocation and cannot authorize
        dependent work. The response is limited to 128 KiB. Each read freshly
        authenticates in one read transaction; it is not a cached grant for
        later operations. Other query filters and context/audit headers are
        rejected. The bridge rechecks actual stored request authors before
        execution/delivery and its explicitly configured human before forwarding
        host tool approval; this read grants no host access.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: view
          in: query
          schema: { type: string, enum: [work, identity, orientation, authority] }
        - name: memberId
          in: query
          style: form
          explode: true
          schema:
            type: array
            maxItems: 64
            items: { type: string, minLength: 1, maxLength: 128 }
          description: Exact member IDs for view=authority only; defaults always include caller and owner.
        - name: work_cursor
          in: query
          schema: { type: string, maxLength: 4096 }
          description: Exact opaque continuation from a normalized work or orientation view; only with the same view.
        - name: messages
          in: query
          schema: { type: string, enum: [recent] }
        - name: X-Project-Room-Audit-View
          in: header
          schema: { type: string, enum: [activity-v1] }
      responses:
        '200': { description: Snapshot }
        '401': { description: unauthenticated }
        '422': { description: "invalid_snapshot_view, invalid_help_context or invalid_offer_context" }
  /api/rooms/{roomId}/bootstrap:
    get:
      summary: Room open bundle
      description: >-
        One read for opening a room. `snapshot` is the same window as
        `GET /api/rooms/{roomId}` (newest messages that fit the byte budget,
        `messagesWindow`, `messagesPage`). Alongside it: `needsAttention`,
        `presence`, `readHorizon`, `saved`, and `updates`. A section the
        caller cannot read is `{ available: false, code }` (for example
        needs-attention is owner-only). A section that succeeded is
        `{ available: true, value }`. Same read as MCP room_read_bootstrap.
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '200': { description: "{ bootstrapVersion, roomId, sequence, snapshot, needsAttention, presence, readHorizon, saved, updates }" }
        '401': { description: unauthenticated }
        '422': { description: invalid_snapshot_view }
  /api/rooms/{roomId}/messages:
    get:
      summary: Older room messages
      description: >-
        One page of visible messages older than `before` (a posting
        sequence from `messagesPage.before`). `limit` defaults to 100 and
        cannot exceed 100. The page is the same byte budget as the room
        window. `messagesPage.hasMore` says whether another older page exists.
      parameters:
        - $ref: '#/components/parameters/RoomId'
        - name: before
          in: query
          schema: { type: integer, minimum: 0 }
        - name: beforeId
          in: query
          description: Message ID tie-break paired with before; continue using both cursor values returned by the previous page.
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200': { description: "{ messagesVersion, roomId, sequence, messages, messagesPage }" }
        '401': { description: unauthenticated }
        '422': { description: invalid_snapshot_view }
