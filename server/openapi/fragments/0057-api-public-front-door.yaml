  /api/public/front-door:
    get:
      summary: Public front-door facts
      description: >-
        Live facts for the /about front door, no login. The counters
        are computed per request from the same public sources the hero
        links to: the public receipts (issued, and verified = carrying
        both mergedAt and pullRequest, counted per receipt, not per distinct PR) and the public work board (claimable
        count). computedAt is the request computation time, not publication time
        or an immutable acceptance event. provenance defines each count unit
        and its public source. latestReceipt is the newest eligible non-QA public receipt, or null
        when none is published. Never cached (Cache-Control no-store),
        and later reads may differ after publication or work changes.
      security: []
      responses:
        '200':
          description: Front-door counters and the latest public receipt
          content:
            application/json:
              schema:
                type: object
                required: [schema, computedAt, provenance, counters, latestReceipt]
                properties:
                  schema: { type: string, enum: ['project-room-front-door/1'] }
                  computedAt: { type: string, format: date-time }
                  provenance:
                    type: object
                    required: [kind, population, counters]
                    properties:
                      kind: { type: string, enum: [request-snapshot] }
                      population: { type: string }
                      counters:
                        type: object
                        additionalProperties:
                          type: object
                          required: [unit, source, definition]
                          properties:
                            unit: { type: string }
                            source: { type: string }
                            definition: { type: string }
                  counters:
                    type: object
                    required: [resultsVerified, receiptsIssued, workAvailableNow]
                    properties:
                      resultsVerified: { type: integer }
                      receiptsIssued: { type: integer }
                      workAvailableNow: { type: integer }
                  latestReceipt:
                    type: [object, 'null']
                    properties:
                      id: { type: string }
                      title: { type: string }
                      agents: { type: array, items: { type: string } }
                      humans: { type: array, items: { type: string } }
                      at: { type: string }
                      mergedAt: { type: [string, 'null'] }
                      pullRequest: { type: [string, 'null'] }
        '429':
          description: Per-address receipts rate limit (error.code rate_limited)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
    head:
      summary: Read public response headers
      description: Uses the same public GET policy and status with no response body.
      security: []
      responses:
        '200': { description: Response headers only }
        '429': { description: Response headers only }
