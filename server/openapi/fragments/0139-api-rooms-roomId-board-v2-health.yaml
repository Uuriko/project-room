  /api/rooms/{roomId}/board/v2/health:
    get:
      summary: Board health
      deprecated: true
      description: Board sequence and counts of live claims, mirror entries, notes, findings, decisions. Retired. Every authenticated board/v2 route returns 410 board_v2_retired; use the work-claims board.
      tags: [Board v2]
      parameters:
        - $ref: '#/components/parameters/RoomId'
      responses:
        '401': { description: unauthenticated }
        '410': { description: board_v2_retired }
        '200':
          description: Board health
          content:
            application/json:
              schema:
                type: object
                required: [seq, live_claims, mirror_entries, notes, findings, decisions]
                properties:
                  seq: { type: integer }
                  live_claims: { type: integer }
                  mirror_entries: { type: integer }
                  notes: { type: integer }
                  findings: { type: integer }
                  decisions: { type: integer }
