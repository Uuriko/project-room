# logrotate for the herdr-bridge audit log — 30-day retention, then delete.
# Pane bodies are never written here (bytes/lines/sha256 only), but the log is
# still secret-adjacent: keep it root-owned and rotate aggressively.
/var/log/herdr-bridge/audit.jsonl {
    daily
    rotate 30
    missingok
    notifempty
    compress
    delaycompress
    create 0640 root herdr-bridge
    # After rotation the bridge keeps appending to the new file; also prune
    # anything older than 30 days on bridge start (AuditLog.pruneOld).
    lastaction
        find /var/log/herdr-bridge -name 'audit.jsonl.*' -mtime +30 -delete
    endscript
}
