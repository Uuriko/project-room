name: activity-inbox

on:
  pull_request:
  push:
    paths:
      - "activity-inbox/**"
      - ".github/workflows/activity-inbox.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: activity-inbox
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
