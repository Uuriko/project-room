name: apply-webhook-drain-eligible
on:
  push:
    branches: [cursor/webhook-drain-eligible]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/webhook-drain-eligible
      - name: Apply patch
        run: |
          set -euo pipefail
          if [ ! -f patches/webhook-drain-eligible.patch ]; then echo already applied; exit 0; fi
          git apply patches/webhook-drain-eligible.patch
          git rm -q patches/webhook-drain-eligible.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/agent-plugin-store.mjs tests/cloudflare-platform-fakes.test.js tests/webhook-dispatch-store.test.js
          git commit -m "Webhook drain: select only eligible deliveries; align platform-fakes test with #992 cron rethrow"
          git push origin HEAD:cursor/webhook-drain-eligible
