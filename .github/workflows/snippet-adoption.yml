name: snippet-adoption

# Mondays 13:00 UTC. Counts public repos that carry the coordination marker.
# ADOPTION_SEARCH_TOKEN, when set, is a fine-grained PAT for public repositories
# with no write permission. Without it the job tries GITHUB_TOKEN and exits 0
# with "skipped: ADOPTION_SEARCH_TOKEN not set" if public code search is refused.
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: snippet-adoption
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Count coordination-snippet repos
        env:
          ADOPTION_SEARCH_TOKEN: ${{ secrets.ADOPTION_SEARCH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOM_OPS_POST_TOKEN: ${{ secrets.ROOM_OPS_POST_TOKEN }}
          ROOM_OPS_ROOM_ID: ${{ secrets.ROOM_OPS_ROOM_ID }}
          ANALYTICS_INGEST_TOKEN: ${{ secrets.ANALYTICS_INGEST_TOKEN }}
        run: node scripts/snippet-adoption.mjs --date "${{ steps.day.outputs.day }}" --out "adoption-${{ steps.day.outputs.day }}.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: adoption-${{ steps.day.outputs.day }}
          path: adoption-${{ steps.day.outputs.day }}.json
          retention-days: 90
          if-no-files-found: ignore
