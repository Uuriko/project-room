name: contributor-ci

# Pull requests from forks get lint, secret scan, docs links and the tests
# selected for their changed files on every push,
# without waiting for a maintainer to add ready-to-land (which starts the full
# suite in test.yml). Runs the contributor's code with a read-only token and no
# secrets. Maintainer branches skip this; test.yml covers them.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: contributor-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    if: github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Lint
        run: npm run lint
      - name: Secret scan
        run: node scripts/secret-scan-check.mjs
      - name: Whitespace
        run: git diff --check "origin/$BASE_REF"...HEAD
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
      - name: Docs links
        run: node scripts/docs-link-check.mjs
      - name: Selected tests for the changed files
        run: bash scripts/test-env.sh npm run verify:affected -- "--base=origin/$BASE_REF" --budget=300
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
