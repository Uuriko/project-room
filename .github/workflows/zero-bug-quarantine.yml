# Zero-Bug: flaky-test quarantine gate

name: zero-bug-quarantine

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quarantine-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enforce quarantine contract
        run: node scripts/quarantine-check.mjs
