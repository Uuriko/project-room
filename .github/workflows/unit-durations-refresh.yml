name: unit-durations-refresh

# Self-updating shard balancer (lane G4): the unit-shards planner balances on
# scripts/unit-ci-durations.json, which decays without fresh data. Each shard
# already records per-file wall times into its evidence artifact; this job
# regenerates the durations file from per-file medians across recent
# successful main runs and opens a PR when it changed materially. The merge
# train lands it like any other PR (green CI + approval); the planner then
# rebalances on fresh data automatically.
on:
  schedule:
    # Weekly, Monday 09:17 UTC (02:17 PDT): off-peak for the CI queue.
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Regenerate durations from recent main runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/unit-durations-refresh.mjs --runs 10
      - name: Open update PR when the durations changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- scripts/unit-ci-durations.json; then
            echo "durations unchanged; no PR needed"
            exit 0
          fi
          BRANCH="bot/unit-durations-refresh-$(date -u +%Y%m%d)"
          git checkout -b "$BRANCH"
          git add scripts/unit-ci-durations.json
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "CI: refresh unit shard durations from recent main runs" \
            -m "Generated by scripts/unit-durations-refresh.mjs (per-file medians across recent successful main runs). Keeps the unit-shards balancer on fresh data."
          git push -u origin "$BRANCH"
          gh pr create --title "CI: refresh unit shard durations from recent main runs" --body \
            "Automated refresh of scripts/unit-ci-durations.json from per-file medians across the last 10 successful main runs of test.yml.

          The unit-shards planner balances on this file; without refresh the estimates decay and shards drift apart (shard 1/3 was measured ~2x the others). Review the diff for sanity (totals should track the ~10-15 min suite, no file absurdly large), then land via the merge train." \
            --base main --head "$BRANCH"
