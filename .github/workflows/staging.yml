name: staging

# Deploy main to the isolated staging Worker (env.staging, script
# project-room-stage) and check it. This never deploys production.
# A missing CLOUDFLARE_API_TOKEN or ROOM_AGENT_CARD_SIGNING_KEY Actions
# secret fails this workflow with "missing <NAME>" instead of going green
# without deploying. This workflow is not a required check, so it never
# blocks merges to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Require the deploy secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SIGNING_KEY: ${{ secrets.ROOM_AGENT_CARD_SIGNING_KEY }}
        run: |
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=missing CLOUDFLARE_API_TOKEN::missing CLOUDFLARE_API_TOKEN: staging was NOT deployed. Add that Actions secret (Workers scripts edit on this account). See docs/STAGING.md."
            missing="$missing CLOUDFLARE_API_TOKEN"
          fi
          if [ -z "$SIGNING_KEY" ]; then
            echo "::error title=missing ROOM_AGENT_CARD_SIGNING_KEY::missing ROOM_AGENT_CARD_SIGNING_KEY: the Worker build signs the agent card and fails closed without it. See docs/AGENT-CARD-CUSTODY.md."
            missing="$missing ROOM_AGENT_CARD_SIGNING_KEY"
          fi
          if [ -n "$missing" ]; then
            {
              echo "## Isolated staging"
              echo ""
              echo "Not deployed. Missing Actions secret(s):$missing"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.gate.outputs.ready == 'true'
        with:
          version: 10
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm --dir cloudflare install --frozen-lockfile --ignore-scripts
      - name: Deploy isolated staging
        if: steps.gate.outputs.ready == 'true'
        working-directory: cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROOM_AGENT_CARD_SIGNING_KEY: ${{ secrets.ROOM_AGENT_CARD_SIGNING_KEY }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -o pipefail
          pnpm exec wrangler deploy --env staging --keep-vars | tee "$RUNNER_TEMP/wrangler-deploy.txt"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const config = JSON.parse(readFileSync("wrangler.jsonc", "utf8"));
            const origin = config.env.staging.vars.ROOM_ORIGIN;
            const log = readFileSync(process.env.RUNNER_TEMP + "/wrangler-deploy.txt", "utf8");
            const hosts = [...log.matchAll(/https:\/\/[a-z0-9-]+\.[a-z0-9-]+\.workers\.dev/g)].map(match => match[0]);
            if (hosts.length && !hosts.includes(origin)) {
              console.error("Staging deployed at " + hosts.join(", ") + " but ROOM_ORIGIN is " + origin + ". Update env.staging.vars.ROOM_ORIGIN to the printed host and redeploy.");
              process.exit(1);
            }
            console.log("Staging origin " + origin);
          '
      - name: Cold-start budget
        if: steps.gate.outputs.ready == 'true'
        run: node scripts/cold-start-probe.mjs --base https://project-room-stage.getdasha.workers.dev --max-ms 2000 | tee cold-start.json
      - if: steps.gate.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.gate.outputs.ready == 'true'
        run: npm i --no-save @axe-core/playwright@4.13.0
      - name: Smoke and browser checks
        if: steps.gate.outputs.ready == 'true'
        env:
          ROOM_SMOKE_ORIGIN: https://project-room-stage.getdasha.workers.dev
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/live-smoke.mjs --browser | tee staging-smoke.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.gate.outputs.ready == 'true'
        with:
          name: staging-probe-${{ github.run_id }}
          path: |
            cold-start.json
            staging-smoke.json
          retention-days: 14
