name: qa2-fuzz

# Nightly OpenAPI fuzzing (Schemathesis 4.x, stateful + coverage phases) against a
# throwaway local server. Gate: no 5xx, no 2xx that violates the published schema.
# Spec drift (undocumented 4xx, rejected schema-valid input) is uploaded as artifacts.
on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: npm ci
      - run: scripts/qa2/fuzz.sh qa2-fuzz-out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: qa2-fuzz-${{ github.run_id }}
          path: qa2-fuzz-out
          retention-days: 14
