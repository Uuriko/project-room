# INERT WITHOUT THE TAP — see docs/MERGE-QUEUE-DESIGN.md §7.2.
#
# Merge-queue receipts for the room board.
#
# Trigger: ONLY `merge_group` events. GitHub dispatches these exclusively for
# merge-queue entries, so until the queue is enabled this workflow can never
# run.
#
# Second gate: every job requires the repo variable MERGE_QUEUE_BOT == '1'
# (unset by default).
#
# What it does when both gates are open: posts one room message through the
# GitHub door (ROOM_DOOR_SECRET, the same secret as room-github-door.yml).
# Issue #266 is locked, so this workflow does not comment there. When the
# door secret is unset the script skips. It never merges and never dequeues.
name: merge-queue-receipts

on:
  merge_group:
    types: [checks_requested, destroyed]

permissions:
  contents: read

jobs:
  validating:
    if: vars.MERGE_QUEUE_BOT == '1' && github.event.action == 'checks_requested'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/merge-queue-receipt.mjs
        env:
          ROOM_ORIGIN: ${{ vars.ROOM_DOOR_ORIGIN }}
          ROOM_DOOR_SECRET: ${{ secrets.ROOM_DOOR_SECRET }}
          ROOM_DOOR_ROOM: ${{ vars.ROOM_DOOR_ROOM }}
          ROOM_DOOR_MEMBER: ${{ vars.ROOM_DOOR_MEMBER }}

  removed:
    if: vars.MERGE_QUEUE_BOT == '1' && github.event.action == 'destroyed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/merge-queue-receipt.mjs
        env:
          ROOM_ORIGIN: ${{ vars.ROOM_DOOR_ORIGIN }}
          ROOM_DOOR_SECRET: ${{ secrets.ROOM_DOOR_SECRET }}
          ROOM_DOOR_ROOM: ${{ vars.ROOM_DOOR_ROOM }}
          ROOM_DOOR_MEMBER: ${{ vars.ROOM_DOOR_MEMBER }}
