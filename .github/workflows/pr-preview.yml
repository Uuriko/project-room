name: pr-preview

# One isolated preview Worker per same-repo PR (room-pr-<n>.getdasha.workers.dev),
# built from env.staging by scripts/preview-env.mjs: own Worker script, so its
# own Durable Object namespaces and storage; no routes, no crons, never prod or
# staging data. Runs the isolated live smoke and the #5882 Linear parity probes
# against it, keeps one PR comment up to date, and deletes the Worker when the
# PR closes. Fork PRs are skipped (no secrets). Not a required check.
# Off until the owner sets the repo variable ROOM_PR_PREVIEWS=1, so merging
# this deploys nothing by itself.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: vars.ROOM_PR_PREVIEWS == '1' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Require the deploy secrets
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SIGNING_KEY: ${{ secrets.ROOM_AGENT_CARD_SIGNING_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$SIGNING_KEY" ]; then
            echo "::warning::preview not deployed: CLOUDFLARE_API_TOKEN or ROOM_AGENT_CARD_SIGNING_KEY is not available to this run"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: steps.gate.outputs.ready == 'true'
        with:
          version: 10
      - if: steps.gate.outputs.ready == 'true'
        run: npm ci
      - if: steps.gate.outputs.ready == 'true'
        run: pnpm --dir cloudflare install --frozen-lockfile --ignore-scripts
      - name: Deploy preview Worker
        id: deploy
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ROOM_AGENT_CARD_SIGNING_KEY: ${{ secrets.ROOM_AGENT_CARD_SIGNING_KEY }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          origin=$(node scripts/preview-env.mjs config "$PR")
          echo "origin=$origin" >> "$GITHUB_OUTPUT"
          cd cloudflare && pnpm exec wrangler deploy --config wrangler.preview.jsonc --env preview
      - name: Smoke
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        env:
          ROOM_SMOKE_ORIGIN: ${{ steps.deploy.outputs.origin }}
          ROOM_SMOKE_ISOLATED: "1"
          ROOM_SMOKE_EXPECTED_REVISION: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/live-smoke.mjs > preview-smoke.json
      - name: Linear parity probes (#5882)
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        run: node scripts/preview-env.mjs parity "${{ steps.deploy.outputs.origin }}" preview-parity.json
      - name: Post or update the PR comment
        if: always() && steps.gate.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/preview-env.mjs comment "$PR" "${{ steps.deploy.outputs.origin }}" preview-smoke.json preview-parity.json > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q '.[] | select(.body | startswith("<!-- room-pr-preview -->")) | .id' | head -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null
          else gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md >/dev/null; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.gate.outputs.ready == 'true'
        with:
          name: pr-preview-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            preview-smoke.json
            preview-parity.json
          retention-days: 7

  cleanup:
    if: vars.ROOM_PR_PREVIEWS == '1' && github.event.pull_request.head.repo.full_name == github.repository && github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PR: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - run: pnpm --dir cloudflare install --frozen-lockfile --ignore-scripts
      - name: Delete the preview Worker (and its Durable Objects)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          node scripts/preview-env.mjs config "$PR" >/dev/null
          cd cloudflare && pnpm exec wrangler delete --config wrangler.preview.jsonc --env preview --force || echo "::notice::no preview Worker to delete"
      - name: Update the PR comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate -q '.[] | select(.body | startswith("<!-- room-pr-preview -->")) | .id' | head -1)
          [ -z "$id" ] || { node scripts/preview-env.mjs deleted "$PR" > comment.md; gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md >/dev/null; }
