name: answer-engine-check

# Mondays 15:00 UTC. Asks ChatGPT, Claude, Perplexity, and Grok the prompts in
# docs/answer-engine-prompts.json. A missing OPENAI_API_KEY, ANTHROPIC_API_KEY,
# PERPLEXITY_API_KEY, or XAI_API_KEY skips that engine with
# "skipped: <SECRET> not set". Raw answers are artifacts and are not committed.
on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: answer-engine-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - id: day
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Ask the four answer engines
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          ROOM_OPS_POST_TOKEN: ${{ secrets.ROOM_OPS_POST_TOKEN }}
          ROOM_OPS_ROOM_ID: ${{ secrets.ROOM_OPS_ROOM_ID }}
          ANALYTICS_INGEST_TOKEN: ${{ secrets.ANALYTICS_INGEST_TOKEN }}
        run: node scripts/answer-engine-check.mjs --date "${{ steps.day.outputs.day }}" --out-dir .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: answer-engine-${{ steps.day.outputs.day }}
          path: |
            answer-engine-${{ steps.day.outputs.day }}.json
            answer-engine-raw-${{ steps.day.outputs.day }}.json
          retention-days: 90
          if-no-files-found: ignore
