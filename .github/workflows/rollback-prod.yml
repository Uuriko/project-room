name: rollback-prod

# Roll the production Workers back to recorded version ids. Use the ids from
# a deploy-prod run's pre-deploy artifact or summary, or from
# `wrangler versions list --env production` / `wrangler versions list`.
# Runbook: docs/DEPLOY-LANE.md. Schema migrations are forward-only: a code
# rollback never undoes a migration (docs/ROOM-DEPLOYMENT.md section 5).
on:
  workflow_dispatch:
    inputs:
      prod_version_id:
        description: "project-room (canonical) version id to restore"
        required: true
        type: string
      entry_version_id:
        description: "project-room-staging (public entry) version id to restore; leave empty to keep the entry as is"
        required: false
        type: string
      reason:
        description: "Why (goes into the Cloudflare rollback message and the receipt)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  PROD_ORIGIN: https://room.trydemigod.com
  ENTRY_ORIGIN: https://www.getdasha.com/room
  RECEIPT_ROOM: muse-room
  WRANGLER_SEND_METRICS: "false"

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_ID: ${{ inputs.prod_version_id }}
      ENTRY_ID: ${{ inputs.entry_version_id }}
      REASON: ${{ inputs.reason }}
    steps:
      - name: Validate inputs and secrets
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=missing CLOUDFLARE_API_TOKEN::missing CLOUDFLARE_API_TOKEN: add the Actions secret. Nothing was rolled back."
            exit 1
          fi
          uuid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          [[ "$PROD_ID" =~ $uuid ]] || { echo "::error::prod_version_id is not a version uuid"; exit 1; }
          if [ -n "$ENTRY_ID" ]; then [[ "$ENTRY_ID" =~ $uuid ]] || { echo "::error::entry_version_id is not a version uuid"; exit 1; }; fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - run: pnpm --dir cloudflare install --frozen-lockfile --ignore-scripts
      - name: Record the versions being replaced
        id: pre
        working-directory: cloudflare
        run: |
          set -euo pipefail
          pick() { node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s.slice(s.indexOf("{")));const v=[...(j.versions??[])].sort((a,b)=>b.percentage-a.percentage)[0];console.log(v?v.version_id:"")})'; }
          echo "prod=$(pnpm exec wrangler deployments status --env production --json | pick)" >> "$GITHUB_OUTPUT"
          echo "entry=$(pnpm exec wrangler deployments status --json | pick)" >> "$GITHUB_OUTPUT"
      - name: Roll back
        working-directory: cloudflare
        run: |
          set -euo pipefail
          pnpm exec wrangler rollback "$PROD_ID" --env production --message "rollback-prod run $GITHUB_RUN_ID: ${REASON:0:150}" --yes
          if [ -n "$ENTRY_ID" ]; then
            pnpm exec wrangler rollback "$ENTRY_ID" --message "rollback-prod run $GITHUB_RUN_ID: ${REASON:0:150}" --yes
          fi
      - name: Smoke health, ready, legal pages
        run: |
          sleep 15
          node scripts/prod-deploy-smoke.mjs --origin "$PROD_ORIGIN" --entry "$ENTRY_ORIGIN"
          curl -fsS -A 'Mozilla/5.0 project-room-rollback' "$PROD_ORIGIN/api/version"
      - name: Receipt to muse-room
        if: always()
        continue-on-error: true
        env:
          ROOM_RECEIPT_TOKEN: ${{ secrets.ROOM_RECEIPT_TOKEN }}
          OUTCOME: ${{ job.status }}
          PROD_WAS: ${{ steps.pre.outputs.prod }}
          ENTRY_WAS: ${{ steps.pre.outputs.entry }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$ROOM_RECEIPT_TOKEN" ]; then echo "ROOM_RECEIPT_TOKEN not set; no receipt posted."; exit 0; fi
          node --input-type=module -e '
            const e = process.env, s = v => (v || "?").slice(0, 8);
            const entry = e.ENTRY_ID ? `entry ${s(e.ENTRY_ID)} (was ${s(e.ENTRY_WAS)})` : "entry unchanged";
            const body = `PROD ROLLBACK · prod ${s(e.PROD_ID)} (was ${s(e.PROD_WAS)}) · ${entry} · smoke ${e.OUTCOME === "success" ? "ok" : e.OUTCOME} · ${e.REASON.slice(0, 200)} · ${e.RUN_URL}`;
            const command = { id: crypto.randomUUID(), type: "message.posted", data: { messageId: crypto.randomUUID(), body } };
            const res = await fetch(`${e.PROD_ORIGIN}/api/rooms/${e.RECEIPT_ROOM}/commands`, {
              method: "POST",
              headers: { authorization: `Bearer ${e.ROOM_RECEIPT_TOKEN}`, "content-type": "application/json", origin: e.PROD_ORIGIN,
                "user-agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36 project-room-rollback-prod" },
              body: JSON.stringify(command),
            });
            console.log(`receipt: HTTP ${res.status}`);
            if (!res.ok) process.exit(1);
          '
