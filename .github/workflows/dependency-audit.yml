# dependency-audit — advisory gate for the three dependency trees.
#
# Background (audit wave 2026-10-24, lane d5): 11 distinct advisories landed in
# the GitHub Advisory DB against this repo's locked versions within 72 hours —
# including a production-reachable DoS in the vendored sanitize-html bundle —
# and no CI job ran any audit, so nothing noticed. This workflow is the tripwire.
#
# Scope per tree, by reachability:
# - root: BLOCKING. The root tree is the only one that reaches production
#   (sanitize-html is vendored into server/ from it), so a moderate+ advisory
#   here fails the run.
# - relay: report-only. Its known advisories hang off the check-only
#   @modelcontextprotocol/sdk subtree (one check file); making it blocking
#   today would fail every run until that separate cleanup lands. Flip to
#   blocking when its audit is clean.
# - cloudflare: report-only until the first scheduled run confirms the tree
#   audits clean end-to-end, then flip to blocking the same way.
#
# Runs on PRs that touch a manifest or lockfile, weekly, and on demand.
name: dependency-audit

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'relay/package.json'
      - 'relay/package-lock.json'
      - 'cloudflare/package.json'
      - 'cloudflare/pnpm-lock.yaml'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit-root:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit root tree (blocking)
        run: npm audit --audit-level=moderate

  audit-relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci --prefix relay --ignore-scripts
      - name: Audit relay tree (report-only — see header)
        run: npm audit --prefix relay --audit-level=moderate

  audit-cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: cloudflare/pnpm-lock.yaml
      - run: pnpm --dir cloudflare install --frozen-lockfile --ignore-scripts
      - name: Audit cloudflare tree (report-only — see header)
        run: pnpm --dir cloudflare audit --audit-level=moderate
