name: onboarding-probe

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: production or staging
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mode: ${{ steps.target.outputs.mode }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Resolve target
        id: target
        env:
          ROOM_STAGING_ORIGIN: ${{ vars.ROOM_STAGING_ORIGIN }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.target }}" = "production" ] || [ -z "${{ inputs.target }}" ]; then
            echo "origin=https://room.trydemigod.com" >> "$GITHUB_OUTPUT"
            echo "mode=production" >> "$GITHUB_OUTPUT"
          elif [ -z "$ROOM_STAGING_ORIGIN" ]; then
            echo "staging target is not configured"
            echo "mode=unconfigured" >> "$GITHUB_OUTPUT"
            echo "origin=" >> "$GITHUB_OUTPUT"
          else
            echo "origin=$ROOM_STAGING_ORIGIN" >> "$GITHUB_OUTPUT"
            echo "mode=staging" >> "$GITHUB_OUTPUT"
          fi
      - name: Run probe
        if: steps.target.outputs.mode != 'unconfigured'
        env:
          ROOM_OPS_POST_TOKEN: ${{ secrets.ROOM_OPS_POST_TOKEN }}
          ROOM_OPS_ROOM_ID: ${{ secrets.ROOM_OPS_ROOM_ID }}
          PROBE_ROUND: ${{ github.run_id }}
        run: node scripts/onboarding-probe/run.mjs --target "${{ steps.target.outputs.origin }}" --runs 5 --out probe-out
      - name: Gate
        if: steps.target.outputs.mode != 'unconfigured'
        continue-on-error: true
        run: node scripts/onboarding-probe/gate.mjs --result probe-out/probe-result.json --baseline docs/onboarding-probe/baseline.json
      - name: Publish summary
        if: always()
        run: |
          if [ "${{ steps.target.outputs.mode }}" = "unconfigured" ]; then
            echo "staging target is not configured" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f probe-out/table.md ]; then
            cat probe-out/table.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always() && steps.target.outputs.mode != 'unconfigured'
        with:
          name: onboarding-probe
          path: probe-out
          if-no-files-found: warn

  # Publishes the run table to docs/onboarding-probe/results.md (newest run
  # first) so measured onboarding times are visible from the repo, not only
  # in the CI job summary. Separate job so the probe itself keeps read-only
  # permissions; this job alone can push the docs file.
  # Runs only on main: a workflow_dispatch from any other ref must never
  # push that ref's commits to main.
  publish:
    name: publish results to docs
    needs: probe
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        id: artifact
        continue-on-error: true
        with:
          name: onboarding-probe
          path: probe-out
      - name: Write docs results
        id: write
        if: steps.artifact.outcome == 'success' && hashFiles('probe-out/table.md') != ''
        run: |
          node scripts/onboarding-probe/docs-publish.mjs \
            --result probe-out/probe-result.json \
            --table probe-out/table.md \
            --docs docs/onboarding-probe/results.md \
            --mode "${{ needs.probe.outputs.mode }}" \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Commit docs results
        if: steps.write.outcome == 'success'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/onboarding-probe/results.md
          git diff --cached --quiet && { echo "no docs changes"; exit 0; }
          git commit -m "docs: publish onboarding probe results (run ${{ github.run_id }})"
          git fetch origin main:refs/remotes/origin/main
          git rebase origin/main
          # Fail closed: the only change ever pushed to main is the results file.
          if [ "$(git show --name-only --format= HEAD | tr '\n' ' ')" != "docs/onboarding-probe/results.md " ]; then
            echo "refusing to push: publish commit touches unexpected files"
            git show --name-only --format= HEAD
            exit 1
          fi
          git push origin HEAD:main
