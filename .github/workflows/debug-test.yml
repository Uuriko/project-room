name: debug-unit-tap
on:
  workflow_dispatch:
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - run: node --test --test-reporter=tap > /tmp/tap.log 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: tap-log
          path: /tmp/tap.log
