name: member-capabilities

on:
  pull_request:
  push:
    paths:
      - "member-capabilities/**"
      - ".github/workflows/member-capabilities.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: member-capabilities
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
