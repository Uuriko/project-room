name: member-capabilities

on:
  pull_request:
  push:
    paths:
      - "member-capabilities/**"
      - ".github/workflows/member-capabilities.yml"

permissions:
  contents: read

# Cancel superseded PR checks; preserve every main/manual run independently.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: member-capabilities
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm test
