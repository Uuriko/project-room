# Zero-bug gates (workstream 2a): SAST, secret scan, dependency existence.
#
# Not required merge checks. They used to start three jobs on every pull
# request. The account runs about two jobs at a time, so this workflow now
# runs as one job on pushes to main, nightly, and workflow_dispatch. A secret
# that lands on main fails the push run; the nightly run covers the recent
# history window when a push was skipped.

name: zero-bug-gates

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  gates:
    name: SAST, secrets, and dependency existence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Secret scanning
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            BASE="$BEFORE"
            if [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
              BASE="$(git rev-parse HEAD~1)"
            fi
          else
            BASE="$(git rev-parse --verify HEAD~30 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi
          node scripts/scan-secrets.mjs --base "$BASE"
      - name: Dependency existence (slopsquatting defense)
        run: node scripts/check-deps-exist.mjs
      - name: Install eslint
        run: npm ci
      - name: SAST (eslint-plugin-security)
        run: npx eslint --config eslint.security.config.mjs .
