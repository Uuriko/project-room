# Pull-request guardrails. None of these jobs is a required check.
#
# throughput: an author with more than 5 open pulls gets the `throughput`
# label and one comment. Finish, rebase, or land. The pull stays open.
# claim-first: a description should cite a Room claim or task id. Without
# one, comment and run the file-set duplicate check from #4929.
# stale: every 6 hours, close pulls with no commits for 72 hours whose
# checks are red or that conflict. One comment carries the head SHA. Append
# the row to docs/ARCHIVED-WORK.md on automation/archived-work (main is
# protected, so the row lands through that pull, labeled keep). Labels
# `keep` and `ready-to-land` are never closed.
name: pr-guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  throughput:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Label and comment when the author is over the open-PR cap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          OPEN=$(gh pr list --repo "$REPO" --author "$AUTHOR" --state open --limit 1000 --json number --jq 'length')
          node scripts/pr-guardrails.mjs cap --open "$OPEN" --author "$AUTHOR" --number "$PR_NUMBER" > /tmp/cap.json
          OVER=$(node --input-type=commonjs -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("/tmp/cap.json","utf8")).over))')
          gh label create throughput --repo "$REPO" --color c5def5 --description "Author is over the open-PR cap. A throughput signal, not a block." --force >/dev/null 2>&1 || true
          if [ "$OVER" = "true" ]; then
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label throughput || echo "label failed"
            for id in $(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate -q '.[] | select(.body | contains("<!-- pr-throughput -->")) | .id' 2>/dev/null); do
              gh api -X DELETE "repos/$REPO/issues/comments/$id" >/dev/null 2>&1 || true
            done
            node --input-type=commonjs -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("/tmp/cap.json","utf8")).comment)' > /tmp/cap.md
            gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/cap.md || echo "comment failed"
          else
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label throughput >/dev/null 2>&1 || true
          fi

  claim-first:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Ask for a Room claim and report duplicate pulls
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr view "$PR_NUMBER" --repo "$REPO" --json body --jq '.body' > /tmp/body.md
          gh pr list --repo "$REPO" --state open --limit 1000 --json number,title,files > /tmp/pulls.json
          node scripts/pr-guardrails.mjs claim-first --body-file /tmp/body.md --input /tmp/pulls.json --number "$PR_NUMBER" > /tmp/claim.json
          CITED=$(node --input-type=commonjs -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("/tmp/claim.json","utf8")).cited))')
          for id in $(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate -q '.[] | select(.body | contains("<!-- pr-claim-first -->")) | .id' 2>/dev/null); do
            gh api -X DELETE "repos/$REPO/issues/comments/$id" >/dev/null 2>&1 || true
          done
          if [ "$CITED" = "true" ]; then
            echo "description cites a Room claim or task"
            exit 0
          fi
          node --input-type=commonjs -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("/tmp/claim.json","utf8")).comment)' > /tmp/claim.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file /tmp/claim.md || echo "comment failed"

  stale:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 1
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Close stale red or conflicting pulls and append the archive
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh pr list --repo "$REPO" --state open --limit 1000 --json number,title,author,labels,headRefOid,headRefName,mergeable,statusCheckRollup,commits > /tmp/open.json
          node scripts/pr-guardrails.mjs stale-plan --input /tmp/open.json --comments-dir /tmp/stale-comments > /tmp/plan.json
          COUNT=$(node --input-type=commonjs -e 'process.stdout.write(String(JSON.parse(require("fs").readFileSync("/tmp/plan.json","utf8")).close.length))')
          echo "stale candidates: $COUNT"
          if [ "$COUNT" = "0" ]; then
            exit 0
          fi
          node --input-type=commonjs -e 'const plan=JSON.parse(require("fs").readFileSync("/tmp/plan.json","utf8")); process.stdout.write(JSON.stringify(plan.close))' > /tmp/rows.json
          git fetch origin main
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Check out the archive branch before writing. checkout -B replaces
          # the worktree, so an earlier write would be discarded.
          git checkout -B automation/archived-work origin/main
          PREVIOUS=""
          if git fetch origin automation/archived-work; then
            git show origin/automation/archived-work:docs/ARCHIVED-WORK.md > /tmp/previous.md
            PREVIOUS="--previous /tmp/previous.md"
          fi
          node scripts/pr-guardrails.mjs archive-merge --main docs/ARCHIVED-WORK.md $PREVIOUS --rows /tmp/rows.json --out docs/ARCHIVED-WORK.md
          git add docs/ARCHIVED-WORK.md
          if git diff --cached --quiet; then
            echo "archive already matches main"
          else
            git commit -m "Archive stale-closed pull requests"
            # force-with-lease refuses to create a branch that has no
            # remote-tracking ref. The first run pushes plain; later runs
            # lease against the ref this fetch just updated.
            if git rev-parse --verify --quiet refs/remotes/origin/automation/archived-work >/dev/null; then
              git push --force-with-lease origin HEAD:automation/archived-work
            else
              git push origin HEAD:automation/archived-work
            fi
            EXISTING=$(gh pr list --repo "$REPO" --head automation/archived-work --state open --json number --jq '.[0].number // empty')
            if [ -z "$EXISTING" ]; then
              gh pr create --repo "$REPO" --base main --head automation/archived-work \
                --title "Archive stale-closed pull requests" \
                --body "Rows appended by pr-guardrails for pulls closed after 72 hours with red checks or conflicts. Each row keeps the head SHA. This pull is labeled keep so the closer leaves it alone."
              EXISTING=$(gh pr list --repo "$REPO" --head automation/archived-work --state open --json number --jq '.[0].number')
            fi
            gh label create keep --repo "$REPO" --color eeeeee --description "Stale closer leaves this pull alone." --force >/dev/null 2>&1 || true
            gh pr edit "$EXISTING" --repo "$REPO" --add-label keep || echo "keep label failed"
          fi
          FAILED=0
          for file in /tmp/stale-comments/*.md; do
            [ -e "$file" ] || continue
            number=$(basename "$file" .md)
            if gh api "repos/$REPO/issues/$number/comments" --paginate -q '.[] | select(.body | contains("<!-- pr-stale-close -->")) | .id' | grep -q .; then
              echo "#$number already has a stale comment"
            else
              gh pr comment "$number" --repo "$REPO" --body-file "$file" || FAILED=1
            fi
            gh pr close "$number" --repo "$REPO" || FAILED=1
          done
          exit "$FAILED"
