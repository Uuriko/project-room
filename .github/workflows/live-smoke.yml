name: live-smoke

# Production smoke for room.trydemigod.com: deploy lag vs main, discovery
# integrity, public pages, and a browser pass (page errors, CSP, 390 px
# overflow, axe WCAG 2.2 AA). Read-only: it never signs in or writes.
# Triaged open findings are warnings (KNOWN in scripts/live-smoke.mjs);
# anything new fails the run. See docs/QA-SYSTEM.md.
# This 6-hour schedule stays the deep check. The 5-minute outage probe is the
# separate Worker in cloudflare/external-probe.wrangler.jsonc.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm i --no-save @axe-core/playwright@4.13.0
      - run: node scripts/live-smoke.mjs --browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
