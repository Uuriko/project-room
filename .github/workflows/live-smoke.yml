name: live-smoke

# Production smoke for room.trydemigod.com: deploy lag vs main, discovery
# integrity, public pages, and a browser pass (page errors, CSP, 390 px
# overflow, axe WCAG 2.2 AA). Read-only: it never signs in or writes.
# Triaged open findings are warnings (KNOWN in scripts/live-smoke.mjs);
# anything new fails the run. See docs/QA-SYSTEM.md.
# This 6-hour schedule stays the deep check. The 5-minute outage probe is the
# separate Worker in cloudflare/external-probe.wrangler.jsonc.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ vars.PW_CACHE_SALT }}-${{ steps.pw.outputs.version }}-${{ env.ImageVersion }}-chromium
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright Chromium (binary cached) and its OS deps
        run: |
          # CI-DIET 08 (C-1/C-2): cache block copied from test.yml; the
          # --with-deps apt pass only has to succeed once per runner
          # image, proven by the marker inside the cached dir. On a
          # proven hit, install the browser payload only. Poison mode is
          # loud: a lying marker dies on a missing library at first
          # launch - bust the cache via the PW_CACHE_SALT repo variable.
          if [ -f "$HOME/.cache/ms-playwright/.deps-ok-${ImageVersion}" ]; then
            npx playwright install chromium
          else
            npx playwright install --with-deps chromium
            touch "$HOME/.cache/ms-playwright/.deps-ok-${ImageVersion}"
          fi
      - run: npm i --no-save @axe-core/playwright@4.13.0
      - run: node scripts/live-smoke.mjs --browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
