name: apply-webhook-skip-starvation
on:
  push:
    branches: [cursor/webhook-skip-starvation]
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/webhook-skip-starvation
      - name: Apply patch
        run: |
          set -euo pipefail
          if [ ! -f patches/webhook-skip-starvation.patch ]; then echo already applied; exit 0; fi
          git apply patches/webhook-skip-starvation.patch
          git rm -q patches/webhook-skip-starvation.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/agent-plugin-store.mjs tests/webhook-dispatch-store.test.js
          git commit -m "Webhook dispatch: defer skipped deliveries so they cannot starve the due queue"
          git push origin HEAD:cursor/webhook-skip-starvation
