# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io).
#
# Auth is keyless GitHub OIDC. The registry grants publish on
# io.github.<repository_owner>/* to a GitHub Actions identity, and the
# workflow's id-token: write permission is that credential. No registry
# secret. A tag is not required for the exchange.
#
# A push to main publishes only when that push changes server.json.
# A v* tag publishes and sets the version from the tag. workflow_dispatch
# publishes the file as committed. The version must be greater than the
# latest version the registry already reports.
name: mcp-registry-publish

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # Required for mcp-publisher login github-oidc
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Decide whether this run publishes
        id: gate
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] || [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if jq -e '[.commits[]?.added[]?, .commits[]?.modified[]?] | index("server.json")' "$GITHUB_EVENT_PATH" >/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "server.json did not change on this push; not publishing."
          fi
      - name: Set version from tag
        if: ${{ steps.gate.outputs.publish == 'true' && startsWith(github.ref, 'refs/tags/v') }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json
      - name: Validate server.json
        if: steps.gate.outputs.publish == 'true'
        run: node scripts/server-json-check.mjs --against-registry
      - name: Install mcp-publisher
        if: steps.gate.outputs.publish == 'true'
        # Supply-chain: pin the mcp-publisher release AND verify sha256 against the
        # release's published checksums file before extracting. The old
        # floating `latest` download URL moved with every upstream release and
        # ran unverified bytes in a workflow holding id-token: write (OIDC publish).
        run: |
          set -euo pipefail
          MCP_PUB_VERSION="v1.8.1"
          TARBALL="mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz"
          BASE="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUB_VERSION}"
          curl -fsSL -o "${TARBALL}" "${BASE}/${TARBALL}"
          curl -fsSL -o checksums.txt "${BASE}/registry_${MCP_PUB_VERSION#v}_checksums.txt"
          (grep " ${TARBALL}\$" checksums.txt || { echo "checksum entry missing for ${TARBALL}"; exit 1; }) | sha256sum -c -
          tar xz -f "${TARBALL}" mcp-publisher
          rm "${TARBALL}" checksums.txt
      - name: Authenticate to MCP Registry
        if: steps.gate.outputs.publish == 'true'
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        if: steps.gate.outputs.publish == 'true'
        run: ./mcp-publisher publish
