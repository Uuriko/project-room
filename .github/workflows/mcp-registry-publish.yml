# Publishes server.json to the official MCP Registry (registry.modelcontextprotocol.io).
#
# Auth is keyless GitHub OIDC: the workflow's OIDC identity proves the repo
# belongs to the Uuriko org, which owns the io.github.uuriko namespace. No
# stored tokens, no paid listing, nothing interactive.
#
# Bump server.json's version for every publish (registry versions are immutable).
# The publish runs on release tags (v*) or manually via workflow_dispatch.
name: mcp-registry-publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write # Required for mcp-publisher login github-oidc
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json
      - name: Validate server.json
        run: |
          node -e "const m=require('./server.json'); if(!/^io\.github\.uuriko\/project-room$/.test(m.name)) throw new Error('bad name'); if(!(m.description&&m.description.length<=100)) throw new Error('bad description'); if(!m.version) throw new Error('missing version'); if(!m.remotes?.length) throw new Error('no remotes'); console.log('server.json OK', m.name, m.version);"
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
