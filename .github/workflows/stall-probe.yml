name: stall-probe

on:
  workflow_dispatch:
    inputs:
      url:
        description: Origin to probe (no path)
        required: true
        default: https://room.trydemigod.com
      seconds:
        description: How many requests to fire, one per second
        required: true
        default: "20"
      path:
        description: Path on that origin
        required: true
        default: /api/ready
      max_ms:
        description: Fail when p99 latency exceeds this many milliseconds
        required: true
        default: "3000"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Probe one request per second
        run: node scripts/stall-probe.mjs --url "${{ inputs.url }}" --seconds "${{ inputs.seconds }}" --path "${{ inputs.path }}" --max-ms "${{ inputs.max_ms }}"
