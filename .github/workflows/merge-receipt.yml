name: merge-receipt

# One `MERGED #<pr> <sha8> · <title>` receipt in the release room per PR merged
# to main. room_project_state compares these with the PROD DEPLOY receipts to
# answer "what is merged but not deployed" without a hand-written recap.
# Skips cleanly when ROOM_RECEIPT_TOKEN (the secret deploy-prod already uses) is unset.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: merge-receipt-${{ github.sha }}
  cancel-in-progress: false

env:
  PROD_ORIGIN: https://room.trydemigod.com
  RECEIPT_ROOM: room-fafdae79cf8c

jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Post the merge receipt
        continue-on-error: true
        env:
          ROOM_RECEIPT_TOKEN: ${{ secrets.ROOM_RECEIPT_TOKEN }}
          MERGE_SHA: ${{ github.sha }}
          MERGE_MESSAGE: ${{ github.event.head_commit.message }}
        run: node scripts/merge-receipt.mjs
