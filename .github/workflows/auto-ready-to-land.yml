# Optional auto-labeler for ready-to-land.
#
# GITHUB_TOKEN cannot start the labeled heavy jobs (RELEASE-MERGE-GATE.md).
# This workflow only runs when secret LANDING_TOKEN is set to a user or
# GitHub App installation token with issues:write. Without it, the job
# exits 0 and prints the script path for the landing loop.
#
# Prefer: GH_TOKEN=<user-token> node scripts/label-ready-to-land.mjs <pr>

name: auto-ready-to-land

on:
  workflow_run:
    workflows: ["test"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: auto-ready-to-land-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr || github.run_id }}
  cancel-in-progress: true

jobs:
  label:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Resolve PR number
        id: pr
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "n=${{ inputs.pr }}" >> "$GITHUB_OUTPUT"
          else
            n=$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")
            if [ -z "$n" ]; then
              echo "no PR on workflow_run; skip"
              echo "n=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "n=$n" >> "$GITHUB_OUTPUT"
          fi
      - name: Label when LANDING_TOKEN is set
        if: steps.pr.outputs.n != ''
        env:
          GH_TOKEN: ${{ secrets.LANDING_TOKEN }}
          PR: ${{ steps.pr.outputs.n }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "LANDING_TOKEN unset; landing loop should run:"
            echo "  GH_TOKEN=<user-or-app-token> node scripts/label-ready-to-land.mjs $PR"
            exit 0
          fi
          node scripts/label-ready-to-land.mjs "$PR"
