name: soak-test

on:
  schedule:
    # Weekly bounded soak: Mondays 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      duration_s:
        description: "Soak duration in seconds (900 = 15 min; CI caps at ~50 min)"
        required: false
        default: "900"

permissions:
  contents: read

# PRs each have their own group and cancel their own older runs.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-dispatch-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci # the soak harness boots the real server, so it needs installed deps
      - name: bounded soak (15 min) + crash-recovery leg
        env:
          SOAK_DURATION_S: ${{ inputs.duration_s || '900' }}
          SOAK_LOAD_RPS: "10"
          SOAK_CRASH_RECOVERY: "1"
          SOAK_CRASH_AT_S: "300"
          SOAK_REPORT_PATH: ${{ github.workspace }}/soak-report.json
        run: node scripts/soak-run.mjs
      - name: upload soak report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: soak-report
          path: soak-report.json
          if-no-files-found: error
