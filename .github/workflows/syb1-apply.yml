name: syb1-apply
on:
  push:
    branches: [instinct/sybil-resolver-owner-only]
    paths: ['.github/workflows/syb1-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instinct/sybil-resolver-owner-only
          fetch-depth: 2
      - name: Apply SYB1 patch and remove this workflow
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/syb1.patch
          echo "$(sha256sum /tmp/syb1.patch)"
          git apply --index /tmp/syb1.patch
          git rm -q .github/workflows/syb1-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Bounty: sybil confirm/dismiss are owner-only (follow-up to #800)" -m "POST /api/rooms/{room}/bounties/sybil-flags/{id}/confirm|dismiss now return 403 owner_required unless the caller is the room owner (fresh roomAuthority read), before the body is read or anything is written. Reputation projector unchanged. Tests: flagged lanes and a guest get 403 on both routes; the flag stays open; the owner confirms with 200. Claim RC-2026-09-23-SYB1 (#266)."
          git push origin "HEAD:instinct/sybil-resolver-owner-only"
