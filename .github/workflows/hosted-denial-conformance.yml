name: hosted-denial-conformance

on:
  pull_request:
  push:
    paths:
      - "hosted-denial-conformance/**"
      - ".github/workflows/hosted-denial-conformance.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hosted-denial-conformance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
