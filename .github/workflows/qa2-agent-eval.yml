name: qa2-agent-eval

# Agent-user eval suite against a throwaway local server (never production):
# synthetic agent journeys scored pass^3 (tau-bench style outcome checks), the
# authz/IDOR role matrix, abuse-guard refusals, MCP robustness, and the
# official MCP conformance suite with a not-applicable baseline. See
# docs/QA2-SYSTEMS.md.
on:
  pull_request:
    # Coarse prefilter on the pushing commit. Merge commits still match when
    # main touched these paths; jobs.changes re-checks the merge-base diff
    # (scripts/ci-changes.mjs EVAL_PATTERNS — keep the two lists in sync).
    paths: ["server/**", "src/**", "deploy/**", "cloudflare/**", "server.mjs", "scripts/qa2/**", "tests/qa2/**", "openapi*", "package*.json"]
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One in-flight run per pull request and per ref. A newer push cancels
# superseded queued and in-progress runs; the newest run stays.
# workflow_dispatch is keyed by run id so a manual run stays independent.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-dispatch-{1}', github.workflow, github.run_id) || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      eval: ${{ steps.plan.outputs.eval }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Three-dot diff against the PR base needs history on both sides.
      - id: plan
        env:
          EVENT_NAME: pull_request
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.mjs
  eval:
    needs: changes
    # Skip only when the merge-base diff explicitly misses the eval paths.
    # Schedule, workflow_dispatch, and a failed filter still run the suite.
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.eval != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Agent journeys, authz matrix, abuse guards, MCP robustness
        run: node --test --test-concurrency=1 tests/qa2/*.test.js
        env:
          QA2_E2E: "1"
      - name: MCP conformance (official suite + baseline)
        run: |
          PORT=4312 ROOM_DB=$RUNNER_TEMP/conf.sqlite ROOM_INSTANCE_LOCK_PATH=$RUNNER_TEMP/conf.lock node server.mjs > $RUNNER_TEMP/conf-server.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4312/api/health >/dev/null 2>&1 && break; sleep 0.2; done
          node scripts/qa2/mcp-conformance.mjs --url http://127.0.0.1:4312/mcp
