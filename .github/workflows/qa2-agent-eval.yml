name: qa2-agent-eval

# Agent-user eval suite against a throwaway local server (never production):
# synthetic agent journeys scored pass^3 (tau-bench style outcome checks), the
# authz/IDOR role matrix, MCP robustness, abuse-guard ratchet, and the official
# MCP conformance suite with a not-applicable baseline. See docs/QA-SYSTEM.md.
on:
  pull_request:
    paths: ["server/**", "src/**", "deploy/**", "cloudflare/**", "server.mjs", "scripts/qa2/**", "tests/qa2/**", "openapi*", "package*.json"]
  schedule:
    - cron: "41 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa2-agent-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci
      - name: Agent journeys, authz matrix, MCP robustness, abuse guards
        run: node --test --test-concurrency=1 tests/qa2/*.test.js
        env:
          QA2_E2E: "1"
          QA2_FLOOD: "120"
      - name: MCP conformance (official suite + baseline)
        run: |
          PORT=4312 ROOM_DB=$RUNNER_TEMP/conf.sqlite ROOM_INSTANCE_LOCK_PATH=$RUNNER_TEMP/conf.lock node server.mjs > $RUNNER_TEMP/conf-server.log 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:4312/api/health >/dev/null 2>&1 && break; sleep 0.2; done
          node scripts/qa2/mcp-conformance.mjs --url http://127.0.0.1:4312/mcp
