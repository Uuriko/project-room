name: test

on:
  pull_request:
    # ready_for_review starts the heavy jobs after a draft is marked ready.
    # opened/synchronize/reopened are the default pull_request types.
    # labeled starts the run when the landing loop adds ready-to-land.
    # synchronize re-runs it while that label is still on the pull request.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
  # Browser shards still run on pull requests. The coverage ratchet runs
  # on the nightly schedule, workflow_dispatch, and merge_group — not on
  # pull requests or main pushes. It was the ~14 minute long pole and it
  # is not a required check.
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Pull requests each have their own group and cancel their own older runs.
# Pushes to main share `test-main` and do not cancel the run already in
# progress: GitHub finishes that main SHA and keeps only the newest pending
# run (any older pending run in the group is cancelled). A main SHA can
# therefore finish `test` between merges. workflow_dispatch is keyed by run
# id: a manual run neither cancels the tip nor is cancelled by it.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-dispatch-{1}', github.workflow, github.run_id) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'test-main') || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') && github.event_name != 'workflow_dispatch' }}

jobs:
  # Pull requests only. Push to main skips this job so the full matrix starts
  # immediately. Shards run unless this job explicitly sets browser=false.
  # docs_only is true only when every file is markdown or under docs/.
  # Pull-request work waits for the ready-to-land label and a non-draft PR.
  # Push, schedule, merge_group, and workflow_dispatch have no pull_request
  # payload; null == false is false in Actions expressions, so those events
  # are allowed by the event_name guard instead of the label check.
  changes:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ready-to-land')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      browser: ${{ steps.plan.outputs.browser }}
      coverage: ${{ steps.plan.outputs.coverage }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Three-dot diff against the PR base needs history on both sides.
      - id: plan
        env:
          EVENT_NAME: pull_request
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.mjs
  contract:
    needs: [changes]
    # Drafts skip the job (the check reports once the PR is ready). A docs-only
    # diff still runs the job so the required `contract` check reports success.
    if: always() && !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ready-to-land')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Docs-only pull request
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "docs-only diff; contract check is unchanged" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          fetch-depth: 0 # The v2-journal and runtime-package gates read retained ancestor commits.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: npm
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci # `npm run check` now includes the lint gate, which needs the eslint devDependency.
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm run check
  # Fo follow-up (Q003): the .refresh-requested marker is a branch-local
  # refresh signal for the visual regression baselines. If it ever reaches
  # main, every visual run silently re-baselines instead of comparing and
  # the regression gate dies quietly. This job fails the run when the marker
  # is present on main; on branches the marker stays legal (the refresh flow
  # commits it there to capture CI-canonical baselines).
  visual-refresh-guard:
    needs: [changes]
    # A docs-only diff cannot add the refresh marker. Drafts skip it. Push and
    # ready code pull requests still run it.
    if: always() && !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ready-to-land'))) && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail if the baseline refresh marker reached main
        run: |
          marker="scripts/visual-regression-baselines/.refresh-requested"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ -e "$marker" ]; then
            echo "::error file=$marker::.refresh-requested must never be on main: it flips every visual regression run into silent re-baseline mode. Delete the marker and re-capture baselines on a branch instead."
            exit 1
          fi
          echo "visual refresh marker check passed (ref=$GITHUB_REF)"
  lint:
    needs: [changes]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ready-to-land')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Docs-only pull request
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "docs-only diff; lint is unchanged" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          # Depth 2 gives the PR merge commit's first parent (the base branch
          # tip), which the i18n ratchet scans as its base tree.
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: npm
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      # No-new-untested-server-module gate (RC-2026-09-25-302): zero-dep, runs
      # alongside eslint.
      - if: needs.changes.outputs.docs_only != 'true'
        parallel:
          - run: npm run lint
          - run: node scripts/untested-modules-lint.mjs
  # One unit job. Hosted shards on 2026-10-24 were 4–6 minutes each,
  # including setup, and they queued behind the two-job account limit, so
  # the split cost three runner slots without overlapping. One process is
  # about one setup plus the three test portions (historically ~10 minutes;
  # the cap is 25). scripts/unit-ci.mjs --all runs every discovered file and
  # writes unit-all-*.json for the duration refresh.
  unit:
    needs: [changes]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ready-to-land'))) && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # The agent-upgrade gates read retained ancestor commits.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux host isolation for automatic-run unit tests
        id: bwrap
        background: true
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - run: npm ci
      - name: Wait for host isolation install
        wait: bwrap
      - name: Permit the sandbox launcher to create its isolated namespaces
        # Ubuntu 24.04 denies capabilities inside unprivileged user namespaces
        # unless the launcher has an application profile. Scope the exception to
        # distro bubblewrap; keep global AppArmor restrictions and --unshare-all.
        # https://documentation.ubuntu.com/release-notes/24.04/#unprivileged-user-namespace-restrictions
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            if [ -f /etc/apparmor.d/bwrap ]; then
              sudo apparmor_parser -r /etc/apparmor.d/bwrap
            else
              cat > "$RUNNER_TEMP/project-room-bwrap.apparmor" <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
              sudo apparmor_parser -r "$RUNNER_TEMP/project-room-bwrap.apparmor"
            fi
          fi
      - name: Verify automatic host namespace support without operator input
        run: node scripts/host-isolation-preflight.mjs
      - name: Run the unit suite
        run: node scripts/unit-ci.mjs --all
      - name: Report failures to PR
        if: failure() && github.event_name == 'pull_request'
        run: |
          node scripts/report-unit-failures.mjs --all --body-file="$RUNNER_TEMP/unit-failures.md"
          gh pr comment "$PR_NUMBER" --repo Uuriko/project-room --body-file "$RUNNER_TEMP/unit-failures.md" || echo "comment failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-evidence-attempt-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
  browser-shards:
    name: browser shard ${{ matrix.shard }}/6
    needs: changes
    # Skip only when the merge-base diff explicitly does not touch browser
    # paths. A skipped or failed filter, and every main push, still runs shards.
    # Main pushes skip the shards (nightly + PRs still run them).
    if: always() && !cancelled() && github.event_name != 'push' && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ready-to-land'))) && needs.changes.outputs.docs_only != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.browser != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # The packaged fallback gate reads retained ancestor commits.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Playwright Chromium (binary cached) and its OS deps
        run: npx playwright install --with-deps chromium
      - name: Run conversation, composer recovery, Quiet Focus, accessibility, and session browser gates
        # Same suites as test:browser, plus a junit file under test-results/ for the step below.
        run: scripts/test-env.sh npm run test:browser:ci -- --shard=${{ matrix.shard }}/6
      - name: Report failing browser tests as annotations and job summary
        # Readable through the GitHub API (check-run annotations, job summary) even when the raw log is not.
        if: always()
        run: node scripts/report-test-failures.mjs test-results/browser-junit-${{ matrix.shard }}-of-6.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: conversation-browser-evidence-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
  # Keep the required check name stable. Dependency success alone cannot prove
  # the intended matrix was complete: require each exact-run completion receipt.
  browser:
    needs: [changes, browser-shards]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ready-to-land')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Required check name stays `browser`. An intentional shard skip must
      # report success; a skip for any other reason fails closed.
      - name: Main push defers browser shards to the nightly run
        if: github.event_name == 'push' && needs.browser-shards.result == 'skipped'
        run: echo "browser shards run nightly and on pull requests, not on main pushes" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Browser paths unchanged versus the merge base
        if: needs.changes.result == 'success' && needs.changes.outputs.browser == 'false' && needs.browser-shards.result == 'skipped'
        run: echo "browser shards skipped; pull request diff does not touch browser paths" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Docs-only pull request
        if: needs.changes.outputs.docs_only == 'true' && needs.browser-shards.result == 'skipped'
        run: echo "browser shards skipped; pull request diff is docs-only" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fail closed when shards were skipped unexpectedly
        if: github.event_name != 'push' && needs.browser-shards.result == 'skipped' && needs.changes.outputs.docs_only != 'true' && (needs.changes.result != 'success' || needs.changes.outputs.browser != 'false')
        run: echo "browser shards skipped unexpectedly (changes=${{ needs.changes.result }}, browser=${{ needs.changes.outputs.browser }})" && exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.browser-shards.result != 'skipped'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.browser-shards.result != 'skipped'
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.browser-shards.result != 'skipped'
        with:
          # All attempts in this run: a re-run shard uploads under a new attempt
          # number, and browser-shards-check.mjs keeps the latest attempt per
          # shard. Scoping this to the aggregator's own attempt broke
          # single-shard re-runs (the untouched shards' receipts live under
          # the earlier attempt).
          pattern: conversation-browser-evidence-*
          path: browser-evidence
          merge-multiple: true
      - name: Require all six successful browser shards from this run
        if: needs.browser-shards.result != 'skipped'
        env:
          BROWSER_MATRIX_RESULT: ${{ needs.browser-shards.result }}
        run: node scripts/browser-shards-check.mjs browser-evidence
  cloudflare:
    needs: [changes]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ready-to-land')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Docs-only pull request
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "docs-only diff; cloudflare suite is unchanged" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          fetch-depth: 0 # The recovery gate packages an exact retained ancestor.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        if: needs.changes.outputs.docs_only != 'true'
        with:
          version: 10
      - if: needs.changes.outputs.docs_only != 'true'
        run: npm ci
      - name: Resolve Playwright version
        id: pw
        if: needs.changes.outputs.docs_only != 'true'
        run: echo "version=$(node -p "require('./node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        if: needs.changes.outputs.docs_only != 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Playwright Chromium (binary cached) and its OS deps
        id: pwinstall
        if: needs.changes.outputs.docs_only != 'true'
        background: true
        run: npx playwright install --with-deps chromium
      - if: needs.changes.outputs.docs_only != 'true'
        run: pnpm --dir cloudflare install --frozen-lockfile --ignore-scripts
      - name: Wait for Playwright install
        if: needs.changes.outputs.docs_only != 'true'
        wait: pwinstall
      - name: Verify the shared Workers runtime and restart journey
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm test
          npm run test:browser
      - name: Build exact assets and validate the deployment bundle
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
        run: node ../scripts/worker-ci-build.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && needs.changes.outputs.docs_only != 'true'
        with:
          name: cloudflare-browser-evidence
          path: cloudflare/test-results/
          if-no-files-found: ignore
  # Branch protection requires a check named "test". The package workflows that
  # used that job id are gone. This job keeps the name and passes only when
  # the suite jobs above have succeeded. Default success() also fails when any
  # job in the graph was skipped, so an intentional browser-shard skip would
  # skip this required check. Evaluate the direct results instead.
  coverage:
    # Nightly, manual, and merge-queue only. Pull requests and main pushes
    # skip this job; the `test` check treats that skip as success. A skip on
    # schedule, workflow_dispatch, or merge_group fails `test`.
    if: always() && !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group')
    # Per-module coverage ratchet (backlog Q015): runs the root unit suite
    # with V8 coverage and fails when any module in coverage-thresholds.json
    # drops below its threshold. Zero dependencies; the script points TMPDIR
    # at a worktree-local .tmp/ and writes coverage data to ./coverage/
    # (both gitignored) by itself.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # secret-scan-diff and room-lifecycle tests read the origin/main tree.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux host isolation for automatic-run unit tests
        id: bwrap
        background: true
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - run: npm ci
      - name: Wait for host isolation install
        wait: bwrap
      - name: Permit the sandbox launcher to create its isolated namespaces
        # Same setup as the unit job (Ubuntu 24.04 denies capabilities inside
        # unprivileged user namespaces without an application profile).
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            if [ -f /etc/apparmor.d/bwrap ]; then
              sudo apparmor_parser -r /etc/apparmor.d/bwrap
            else
              cat > "$RUNNER_TEMP/project-room-bwrap.apparmor" <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
              sudo apparmor_parser -r "$RUNNER_TEMP/project-room-bwrap.apparmor"
            fi
          fi
      - name: Verify automatic host namespace support without operator input
        run: node scripts/host-isolation-preflight.mjs
      - name: Enforce per-module coverage thresholds
        run: node scripts/coverage-thresholds.mjs
  test:
    needs: [changes, contract, lint, unit, browser, cloudflare, visual-refresh-guard, coverage]
    if: always() && !cancelled() && (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && contains(github.event.pull_request.labels.*.name, 'ready-to-land')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require contract, lint, unit, browser, cloudflare, visual-refresh-guard, and coverage
        env:
          CONTRACT: ${{ needs.contract.result }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
          CLOUDFLARE: ${{ needs.cloudflare.result }}
          VISUAL_REFRESH_GUARD: ${{ needs.visual-refresh-guard.result }}
          COVERAGE: ${{ needs.coverage.result }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          failed=0
          for pair in "contract:$CONTRACT" "lint:$LINT" "unit:$UNIT" "browser:$BROWSER" "cloudflare:$CLOUDFLARE" "visual-refresh-guard:$VISUAL_REFRESH_GUARD" "coverage:$COVERAGE"; do
            name=${pair%%:*}
            result=${pair#*:}
            echo "$name=$result"
            # coverage runs on schedule, workflow_dispatch, and merge_group.
            # pull_request and push skip it on purpose.
            if [ "$name" = "coverage" ] && [ "$result" = "skipped" ]; then
              case "$EVENT_NAME" in
                pull_request|push) continue ;;
              esac
              echo "coverage skipped on $EVENT_NAME"
              failed=1
              continue
            fi
            # Docs-only diffs skip unit and the refresh-marker guard. The
            # required names above still ran and passed.
            if [ "$DOCS_ONLY" = "true" ] && [ "$result" = "skipped" ] && { [ "$name" = "unit" ] || [ "$name" = "visual-refresh-guard" ]; }; then
              continue
            fi
            # browser=success already covers the intentional main-push skip.
            if [ "$result" != "success" ]; then failed=1; fi
          done
          exit "$failed"
