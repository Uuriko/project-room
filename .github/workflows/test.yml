name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The v2-journal and runtime-package gates read retained ancestor commits.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci # `npm run check` now includes the lint gate, which needs the eslint devDependency.
      - run: npm run check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The packaged fallback gate reads retained ancestor commits.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run conversation, composer recovery, Quiet Focus, accessibility, and session browser gates
        run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversation-browser-evidence
          path: test-results/
          if-no-files-found: ignore
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The recovery gate packages an exact retained ancestor.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pnpm --dir cloudflare install --frozen-lockfile --ignore-scripts
      - name: Verify the shared Workers runtime and restart journey
        working-directory: cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
        run: node --test compatibility.check.mjs store.check.mjs http.check.mjs bootstrap.check.mjs reminder-upgrade.check.mjs agent-upgrade.check.mjs maintenance.check.mjs recovery-switch.check.mjs browser.check.mjs
      - name: Build exact assets and validate the deployment bundle
        working-directory: cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler deploy --dry-run --outdir dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-browser-evidence
          path: cloudflare/test-results/
          if-no-files-found: ignore
