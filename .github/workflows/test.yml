name: test

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Pull requests each have their own group and cancel their own older runs.
# Pushes to main share `test-main` and do not cancel the run already in
# progress: GitHub finishes that main SHA and keeps only the newest pending
# run (any older pending run in the group is cancelled). A main SHA can
# therefore finish `test` between merges. workflow_dispatch is keyed by run
# id: a manual run neither cancels the tip nor is cancelled by it.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('{0}-dispatch-{1}', github.workflow, github.run_id) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'test-main') || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main') && github.event_name != 'workflow_dispatch' }}

jobs:
  # Pull requests only. Push to main skips this job so the full matrix starts
  # immediately. Shards run unless this job explicitly sets browser=false.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      browser: ${{ steps.plan.outputs.browser }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Three-dot diff against the PR base needs history on both sides.
      - id: plan
        env:
          EVENT_NAME: pull_request
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-changes.mjs
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # The v2-journal and runtime-package gates read retained ancestor commits.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci # `npm run check` now includes the lint gate, which needs the eslint devDependency.
      - run: npm run check
  # Fo follow-up (Q003): the .refresh-requested marker is a branch-local
  # refresh signal for the visual regression baselines. If it ever reaches
  # main, every visual run silently re-baselines instead of comparing and
  # the regression gate dies quietly. This job fails the run when the marker
  # is present on main; on branches the marker stays legal (the refresh flow
  # commits it there to capture CI-canonical baselines).
  visual-refresh-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fail if the baseline refresh marker reached main
        run: |
          marker="scripts/visual-regression-baselines/.refresh-requested"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ -e "$marker" ]; then
            echo "::error file=$marker::.refresh-requested must never be on main: it flips every visual regression run into silent re-baseline mode. Delete the marker and re-capture baselines on a branch instead."
            exit 1
          fi
          echo "visual refresh marker check passed (ref=$GITHUB_REF)"
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # No-new-untested-server-module gate (RC-2026-09-25-302): zero-dep, no
      # install needed, runs before the heavier suites would even finish.
      - run: node scripts/untested-modules-lint.mjs
  # Root-suite unit tests (tests/*.test.js), sharded 3 ways for wall-clock
  # speed (CI-speed lane: the single `npm test` job was the ~11min long pole
  # of every head). scripts/unit-shards.mjs owns the file allocation
  # (balanced by scripts/unit-ci-durations.json); scripts/unit-ci.mjs runs
  # one shard and writes a receipt; the `unit` job below keeps the required
  # check name and fails closed unless all three exact-run receipts verify.
  unit-shards:
    name: unit shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # The agent-upgrade gates read retained ancestor commits.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install Linux host isolation for automatic-run unit tests
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - name: Permit the sandbox launcher to create its isolated namespaces
        # Ubuntu 24.04 denies capabilities inside unprivileged user namespaces
        # unless the launcher has an application profile. Scope the exception to
        # distro bubblewrap; keep global AppArmor restrictions and --unshare-all.
        # https://documentation.ubuntu.com/release-notes/24.04/#unprivileged-user-namespace-restrictions
        run: |
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            if [ -f /etc/apparmor.d/bwrap ]; then
              sudo apparmor_parser -r /etc/apparmor.d/bwrap
            else
              cat > "$RUNNER_TEMP/project-room-bwrap.apparmor" <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          /usr/bin/bwrap flags=(unconfined) {
            userns,
          }
          PROFILE
              sudo apparmor_parser -r "$RUNNER_TEMP/project-room-bwrap.apparmor"
            fi
          fi
      - name: Verify automatic host namespace support without operator input
        run: node scripts/host-isolation-preflight.mjs
      - name: Run unit shard
        run: node scripts/unit-ci.mjs --shard=${{ matrix.shard }}/3
      - name: Report failures to PR
        if: failure() && github.event_name == 'pull_request'
        run: |
          BODY="## Unit test failures, shard ${{ matrix.shard }}/3 (debug)

          See the job log for the failing file and assertion. Shard receipts
          are in the unit-shard-evidence artifact."
          gh pr comment "$PR_NUMBER" --repo Uuriko/project-room --body "$BODY" || echo "comment failed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: unit-shard-evidence-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
  # Keep the required check name stable. The gate passes only when the matrix
  # succeeded AND all three shards' exact-run receipts verify (same files,
  # same plan hash, same revision) — a partial or stale shard run fails closed.
  unit:
    needs: [unit-shards]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # All attempts in this run: a re-run shard uploads under a new attempt
          # number, and unit-shards-check.mjs keeps the latest attempt per shard.
          pattern: unit-shard-evidence-*
          path: unit-evidence
          merge-multiple: true
      - name: Require all three successful unit shards from this run
        env:
          UNIT_MATRIX_RESULT: ${{ needs.unit-shards.result }}
        run: node scripts/unit-shards-check.mjs unit-evidence
  browser-shards:
    name: browser shard ${{ matrix.shard }}/4
    needs: changes
    # Skip only when the merge-base diff explicitly does not touch browser
    # paths. A skipped or failed filter, and every main push, still runs shards.
    if: always() && !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.browser != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # The packaged fallback gate reads retained ancestor commits.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run conversation, composer recovery, Quiet Focus, accessibility, and session browser gates
        # Same suites as test:browser, plus a junit file under test-results/ for the step below.
        run: scripts/test-env.sh npm run test:browser:ci -- --shard=${{ matrix.shard }}/4
      - name: Report failing browser tests as annotations and job summary
        # Readable through the GitHub API (check-run annotations, job summary) even when the raw log is not.
        if: always()
        run: node scripts/report-test-failures.mjs test-results/browser-junit-${{ matrix.shard }}-of-4.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: conversation-browser-evidence-${{ matrix.shard }}-attempt-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
  # Keep the required check name stable. Dependency success alone cannot prove
  # the intended matrix was complete: require each exact-run completion receipt.
  browser:
    needs: [changes, browser-shards]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Required check name stays `browser`. An intentional shard skip must
      # report success; a skip for any other reason fails closed.
      - name: Browser paths unchanged versus the merge base
        if: needs.changes.result == 'success' && needs.changes.outputs.browser == 'false' && needs.browser-shards.result == 'skipped'
        run: echo "browser shards skipped; pull request diff does not touch browser paths" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Fail closed when shards were skipped unexpectedly
        if: needs.browser-shards.result == 'skipped' && (needs.changes.result != 'success' || needs.changes.outputs.browser != 'false')
        run: echo "browser shards skipped unexpectedly (changes=${{ needs.changes.result }}, browser=${{ needs.changes.outputs.browser }})" && exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.browser-shards.result != 'skipped'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: needs.browser-shards.result != 'skipped'
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.browser-shards.result != 'skipped'
        with:
          # All attempts in this run: a re-run shard uploads under a new attempt
          # number, and browser-shards-check.mjs keeps the latest attempt per
          # shard. Scoping this to the aggregator's own attempt broke
          # single-shard re-runs (the untouched shards' receipts live under
          # the earlier attempt).
          pattern: conversation-browser-evidence-*
          path: browser-evidence
          merge-multiple: true
      - name: Require all four successful browser shards from this run
        if: needs.browser-shards.result != 'skipped'
        env:
          BROWSER_MATRIX_RESULT: ${{ needs.browser-shards.result }}
        run: node scripts/browser-shards-check.mjs browser-evidence
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # The recovery gate packages an exact retained ancestor.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pnpm --dir cloudflare install --frozen-lockfile --ignore-scripts
      - name: Verify the shared Workers runtime and restart journey
        working-directory: cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm test
          npm run test:browser
      - name: Build exact assets and validate the deployment bundle
        working-directory: cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
        run: node ../scripts/worker-ci-build.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: cloudflare-browser-evidence
          path: cloudflare/test-results/
          if-no-files-found: ignore
  # Branch protection requires a check named "test". The package workflows that
  # used that job id are gone. This job keeps the name and passes only when
  # the suite jobs above have succeeded. Default success() also fails when any
  # job in the graph was skipped, so an intentional browser-shard skip would
  # skip this required check. Evaluate the direct results instead.
  coverage:
    # Per-module coverage ratchet (backlog Q015), measured from the unit
    # shards: each unit shard collects V8 coverage from its own test processes
    # and writes a compact covered-line summary into the shard evidence
    # artifact (scripts/unit-ci.mjs; raw payloads stay worktree-local). This
    # job unions the three summaries and enforces the thresholds in
    # coverage-thresholds.json -- the old duplicate ~14-minute full-suite run
    # is gone. Zero dependencies: no npm ci, no bubblewrap, no browser.
    # needs: [unit] -- coverage is only meaningful on a green suite (the old
    # script likewise refused to evaluate when its own suite run failed); the
    # `unit` gate already verified the exact-run shard receipts, so the
    # summaries below are complete and current by construction.
    needs: [unit]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          # All attempts in this run, merged: the summaries are per-shard
          # files (coverage-shard-<i>.json), so attempts never collide.
          pattern: unit-shard-evidence-*
          path: unit-evidence
          merge-multiple: true
      - name: Enforce per-module coverage thresholds
        # Every --summary path must exist: a missing shard summary fails
        # closed here instead of scoring partial data as complete.
        run: node scripts/coverage-thresholds.mjs --summary unit-evidence/test-results/coverage-shard-1.json --summary unit-evidence/test-results/coverage-shard-2.json --summary unit-evidence/test-results/coverage-shard-3.json
  test:
    needs: [contract, lint, unit, browser, cloudflare, visual-refresh-guard, coverage]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require contract, lint, unit, browser, cloudflare, visual-refresh-guard, and coverage
        env:
          CONTRACT: ${{ needs.contract.result }}
          LINT: ${{ needs.lint.result }}
          UNIT: ${{ needs.unit.result }}
          BROWSER: ${{ needs.browser.result }}
          CLOUDFLARE: ${{ needs.cloudflare.result }}
          VISUAL_REFRESH_GUARD: ${{ needs.visual-refresh-guard.result }}
          COVERAGE: ${{ needs.coverage.result }}
        run: |
          failed=0
          for pair in "contract:$CONTRACT" "lint:$LINT" "unit:$UNIT" "browser:$BROWSER" "cloudflare:$CLOUDFLARE" "visual-refresh-guard:$VISUAL_REFRESH_GUARD" "coverage:$COVERAGE"; do
            name=${pair%%:*}
            result=${pair#*:}
            echo "$name=$result"
            if [ "$result" != "success" ]; then failed=1; fi
          done
          exit "$failed"
