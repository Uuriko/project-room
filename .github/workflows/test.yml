name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR checks; preserve every main/manual run independently.
concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The v2-journal and runtime-package gates read retained ancestor commits.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci # `npm run check` now includes the lint gate, which needs the eslint devDependency.
      - run: npm run check
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
  unit:
    # Root-suite unit tests (tests/*.test.js at the repo root). The five
    # path-scoped workflows run `npm test` inside their shard subdirectories
    # only; nothing in CI currently executes the root suite. This is
    # additive: it does not touch the shard workflows or their triggers
    # (see #266 comment 5718947975 — trigger scopes adjudicated working as
    # designed; this proposal leaves them alone).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The agent-upgrade gates read retained ancestor commits.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Install Linux host isolation for automatic-run unit tests
        run: sudo apt-get update -qq && sudo apt-get install -y bubblewrap
      - run: npm test
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The packaged fallback gate reads retained ancestor commits.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run conversation, composer recovery, Quiet Focus, accessibility, and session browser gates
        # Same suites as test:browser, plus a junit file under test-results/ for the step below.
        run: npm run test:browser:ci
      - name: Report failing browser tests as annotations and job summary
        # Readable through the GitHub API (check-run annotations, job summary) even when the raw log is not.
        if: always()
        run: node scripts/report-test-failures.mjs test-results/browser-junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conversation-browser-evidence
          path: test-results/
          if-no-files-found: ignore
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # The recovery gate packages an exact retained ancestor.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: pnpm --dir cloudflare install --frozen-lockfile --ignore-scripts
      - name: Verify the shared Workers runtime and restart journey
        working-directory: cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
        run: node --test compatibility.check.mjs store.check.mjs http.check.mjs google-auth.check.mjs bootstrap.check.mjs reminder-upgrade.check.mjs agent-upgrade.check.mjs maintenance.check.mjs recovery-switch.check.mjs scheduled-rpc.check.mjs browser.check.mjs release-pause-browser.check.mjs
      - name: Build exact assets and validate the deployment bundle
        working-directory: cloudflare
        env:
          WRANGLER_SEND_METRICS: "false"
        run: node ../scripts/worker-ci-build.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-browser-evidence
          path: cloudflare/test-results/
          if-no-files-found: ignore
