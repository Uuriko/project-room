<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#202127">
    <title>Room is offline</title>
    <style>
      :root { color-scheme: dark; --bg: #202127; --text: #eeedf1; --link: #a9b9ff; --blue-strong: #5555bd; }
      body { margin: 2rem; background: var(--bg); color: var(--text); font-family: Inter, ui-sans-serif, system-ui, sans-serif; line-height: 1.5; }
      main { max-width: 40rem; }
      a { color: var(--link); }
      button { margin-top: 1rem; padding: 0.75rem 1.5rem; min-height: 44px; background: var(--blue-strong); color: var(--text); border: none; border-radius: 0.45rem; font: inherit; cursor: pointer; }
      button:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Room is offline</h1>
      <p>You're offline. Only this page is available offline — the room needs the network to load its messages and board.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
