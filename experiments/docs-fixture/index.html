<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project docs · local fixture</title><style>
:root{color-scheme:dark;--bg:#19191c;--panel:#222226;--line:#39393f;--text:#eee;--muted:#aaa;--accent:#b6b4ff;font:15px/1.55 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}header{height:64px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--panel)}header span{color:var(--muted)}header small{margin-left:auto;color:var(--muted)}main{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 64px)}aside{padding:24px 18px;border-right:1px solid var(--line)}h1{font-size:20px;margin:0 0 16px}label{font-size:13px;font-weight:600}input{width:100%;margin:6px 0 12px;padding:10px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--text);font:inherit}nav button{display:block;width:100%;padding:10px;text-align:left;border:0;border-radius:6px;background:transparent;color:var(--text);font:inherit;cursor:pointer}nav button[aria-current=page],nav button:hover{background:var(--line)}.content{padding:40px 6vw;max-width:980px;width:100%;margin:auto}.hint,.meta,#status{font-size:13px;color:var(--muted)}h2{font-size:30px;line-height:1.2;margin:12px 0}h3{margin-top:30px}a{color:var(--accent)}.notice{border:1px solid var(--line);border-radius:8px;padding:10px 14px;font-size:13px;color:var(--muted)}:focus-visible{outline:3px solid var(--accent);outline-offset:2px}button{cursor:pointer}.actions{display:flex;gap:10px;margin:20px 0}.actions button{padding:8px 14px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--text);font:inherit}textarea{width:100%;min-height:250px;padding:12px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:7px;font:14px/1.5 ui-monospace,monospace}.conflict{border:1px solid #c99744;border-radius:8px;padding:12px;margin:12px 0;white-space:pre-wrap}.conflict[hidden]{display:none}@media(max-width:700px){main{display:block}aside{border-right:0;border-bottom:1px solid var(--line)}.content{padding:26px 18px}header{padding:0 16px}}
</style></head><body><header><strong>Project Room</strong><span>/ Example project</span><small>Local fixture · not production</small></header><main><aside><h1>Docs</h1><label for="search">Filter loaded titles</label><input id="search" type="search" placeholder="Filter documents"><p class="hint" id="status" role="status">Loading documents…</p><nav id="docs" aria-label="Documents"></nav><button id="more" hidden>Load more</button></aside><section class="content" id="content" aria-live="polite"><p>Choose a document.</p></section></main><script>
const apiBase=new URLSearchParams(location.search).get('fixture')==='empty'?'/api/empty-docs':'/api/docs';const nav=document.querySelector('#docs'),content=document.querySelector('#content'),status=document.querySelector('#status'),filter=document.querySelector('#search'),more=document.querySelector('#more');let docs=[],next=null,selected=null,flight=0,current=null;const storageKey='project-doc-fixture-drafts-v1:'+apiBase;let storageAvailable=true;let drafts=new Map();try{const saved=JSON.parse(sessionStorage.getItem(storageKey)||'[]');if(Array.isArray(saved)) drafts=new Map(saved.filter(x=>Array.isArray(x)&&typeof x[0]==='string'&&x[1]&&typeof x[1].body==='string'&&Number.isInteger(x[1].baseRev)&&typeof x[1].title==='string'));}catch{storageAvailable=false}function persistDrafts(){try{sessionStorage.setItem(storageKey,JSON.stringify([...drafts]));return true}catch{storageAvailable=false;return false}}const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function read(url,options){const r=await fetch(url,options);if(!r.ok){const e=Error(`Request failed (${r.status})`);e.status=r.status;throw e}return r.json()}
function list(){let match=docs.filter(d=>d.title.toLowerCase().includes(filter.value.trim().toLowerCase()));nav.innerHTML=match.map(d=>`<button data-id="${escapeHtml(d.docId)}" ${d.docId===selected?'aria-current="page"':''}>${escapeHtml(d.title)}</button>`).join('');status.textContent=docs.length?`${match.length} of ${docs.length} loaded documents${next?' · more available':''}`:'No documents available.';if(docs.length&&!match.length)status.textContent='No loaded titles match.';if(selected&&!docs.some(d=>d.docId===selected))status.textContent+=' · Open document is not in the loaded list.';more.hidden=!next}
async function load(after=''){status.textContent='Loading documents…';more.disabled=true;try{const p=await read(apiBase+'?limit=2'+(after?'&after='+encodeURIComponent(after):''));if(!Array.isArray(p.docs)||typeof p.hasMore!=='boolean'||(p.hasMore&&!p.nextAfter))throw Error('Incomplete page');docs=after?[...docs,...p.docs]:p.docs;next=p.hasMore?p.nextAfter:null;list();if(!docs.length&&!selected)content.innerHTML='<h2>No documents yet</h2><p>This room has no documents to read.</p>'}catch(e){status.textContent=`Could not load documents. ${e.message}`;more.hidden=false;more.textContent='Retry'}finally{more.disabled=false}}
function renderBody(body,title){let lines=body.split(/\n/);if(lines[0]?.trim()===`# ${title}`)lines=lines.slice(1);return lines.map(line=>{const h=/^(#{1,3})\s+(.+)$/.exec(line);if(h)return `<h3>${escapeHtml(h[2])}</h3>`;return line?`<p>${escapeHtml(line)}</p>`:''}).join('')}
function renderDoc(d){current=d;const draft=drafts.get(d.docId);content.innerHTML=`<div class="hint">Docs / ${escapeHtml(d.title)}</div><h2 tabindex="-1">${escapeHtml(d.title)}</h2><p class="meta">Revision ${d.rev} · Updated ${escapeHtml(d.updatedAt)}</p><p class="notice">Local synthetic room. Saved changes stay in the test service; unsaved drafts are kept in this tab for reload recovery when browser storage is available.</p><div class="actions"><button type="button" id="edit">Edit Markdown</button></div><div id="edit-area" hidden><label for="draft">Markdown draft</label><textarea id="draft"></textarea><div class="actions"><button type="button" id="save">Save changes</button><button type="button" id="cancel">Close editor</button></div><p id="save-status" role="status"></p><section id="conflict" class="conflict" hidden></section></div><article>${renderBody(d.body,d.title)}</article>`;const area=content.querySelector('#edit-area'),field=content.querySelector('#draft');field.value=draft?.body??d.body;if(draft){area.hidden=false;content.querySelector('#save-status').textContent='Recovered an unsaved draft in this tab. Review it before saving.'}if(!storageAvailable)content.querySelector('.notice').textContent+=' Draft recovery is unavailable; leaving this page may lose your draft.';content.querySelector('#edit').onclick=()=>{area.hidden=false;field.focus()};field.oninput=()=>{const existing=drafts.get(d.docId);drafts.set(d.docId,{body:field.value,baseRev:existing?.baseRev??d.rev,title:existing?.title??d.title});if(!persistDrafts())content.querySelector('#save-status').textContent='Draft recovery is unavailable; leaving this page may lose your draft.'};content.querySelector('#cancel').onclick=()=>{area.hidden=true};content.querySelector('#save').onclick=async()=>{const state=drafts.get(d.docId)??{body:field.value,baseRev:d.rev,title:d.title};drafts.set(d.docId,state);const button=content.querySelector('#save'),notice=content.querySelector('#save-status'),conflict=content.querySelector('#conflict');button.disabled=true;field.disabled=true;notice.textContent='Saving…';try{const result=await read(apiBase+'/'+encodeURIComponent(d.docId),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({title:state.title,body:field.value,baseRev:state.baseRev})});drafts.delete(d.docId);persistDrafts();if(!button.isConnected)return;renderDoc(result.doc);content.querySelector('.meta').insertAdjacentHTML('afterend','<p role="status">Saved.</p>');}catch(e){if(!button.isConnected)return;if(e.status===409){notice.textContent='This document changed. Your draft is preserved below; compare it with the current version before retrying.';try{const latest=(await read(apiBase+'/'+encodeURIComponent(d.docId))).doc;conflict.hidden=false;conflict.textContent=`Current revision ${latest.rev}:\n\n${latest.body}\n\n`;const rebase=document.createElement('button');rebase.type='button';rebase.textContent=`Use revision ${latest.rev} as base`;rebase.onclick=()=>{drafts.set(d.docId,{body:field.value,baseRev:latest.rev,title:latest.title});persistDrafts();notice.textContent='Draft now uses the latest revision as its base. Saving will replace the current text with your draft.';conflict.hidden=true};conflict.appendChild(rebase);}catch{conflict.hidden=false;conflict.textContent='Could not load the current version. Your draft is still here.'}}else notice.textContent=`Could not save. Your draft is still here. ${e.message}`}finally{if(button.isConnected){button.disabled=false;field.disabled=false}}};content.querySelector('h2').focus()}
async function openDoc(id,push=true){const n=++flight;selected=id;list();content.innerHTML='<p>Loading document…</p>';try{const p=await read(apiBase+'/'+encodeURIComponent(id));if(n!==flight)return;const d=p.doc;if(push){const u=new URL(location.href);u.searchParams.set('doc',id);history.pushState({},'',u)}renderDoc(d)}catch(e){if(n===flight)content.innerHTML=`<h2>Document unavailable</h2><p>${escapeHtml(e.message)}</p>`}}
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)openDoc(b.dataset.id)});filter.addEventListener('input',list);more.addEventListener('click',()=>load(next||''));window.addEventListener('popstate',()=>{let id=new URLSearchParams(location.search).get('doc');if(id)openDoc(id,false);else{flight++;selected=null;list();content.innerHTML='<p>Choose a document.</p>'}});load().then(()=>{let id=new URLSearchParams(location.search).get('doc');if(id)openDoc(id,false)});
</script></body></html>
