<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Room · Concept lab</title><link rel="stylesheet" href="/style.css"></head>
<body><header><strong>Project Room <span>Concept lab</span></strong><button id="export" type="button">Export trial</button></header>
<section class="setup" aria-label="Experiment controls"><label>Layout<select id="variant"></select></label><label>Scenario<select id="scenario"></select></label><label>Task<select id="task"><option value="resume">Resume work</option><option value="review">Review and revise</option></select></label><button id="start" type="button">Start fresh trial</button><p>Synthetic material. No live agents or external actions. Changing settings starts a fresh trial.</p></section>
<main><div class="intro"><p id="trial-label"></p><h1 id="title"></h1><p id="brief"></p></div><div id="workspace"><section id="conversation" aria-label="Conversation"><h2>Conversation</h2><ol id="messages"></ol></section><section id="result" aria-label="Selected result"><h2>Result</h2><label>Version<select id="version"></select></label><p id="result-label"></p><pre id="result-body"></pre></section></div>
<section class="response"><h2 id="task-title"></h2><p id="instructions"></p><form id="answer"><div id="resume-fields"><label>Latest proposal<select name="current"></select></label><label>Earlier accepted version<select name="accepted"></select></label><label>Who owns the work?<input name="owner" autocomplete="off"></label><label>What is waiting for confirmation?<input name="blocker" autocomplete="off"></label></div><div id="review-fields" hidden><label>Revision being corrected<select name="basedOn"></select></label><label>Corrected result<textarea name="body" rows="5"></textarea></label></div><button type="submit">Submit answer</button></form><p id="status" role="status"></p></section></main><script type="module" src="/ui.js"></script></body></html>
