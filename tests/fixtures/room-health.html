<!doctype html>
<!-- Fixture for tests/design-tokens.test.js: the room-health page is a generated
     build artifact (scripts/room-health.mjs) and is no longer committed. This fixture
     preserves a generated page shell whose <style> block is copied verbatim from real
     generator output (it embeds HEALTH_PAGE_STYLE) so the token checks keep guarding
     the real stylesheet. Refresh the <style> block from fresh generator output if
     the design-token assertions start failing after a style change. -->
<html><head><meta charset="utf-8"><title>Room health (fixture)</title><style>
:root{color-scheme:dark;--bg:#202127;--panel:#191a20;--panel-raised:#292b33;--panel-hover:#34363f;--line:#393b45;--line-soft:#30323a;--text:#eeedf1;--muted:#aaaab7;--blue:#a9b9ff;--blue-strong:#5555bd;--blue-strong-hover:#6a6ad4;--on-accent:#ffffff;--amber:#ffbf69;--green:#4fd09b;--red:#ff7b7b;--violet:#ad8cff;--card:#191a20;--border:#393b45;--shadow:0 20px 70px rgb(0 0 0 / 32%);--control-min-target-coarse:2.75rem;--radius-sm:.35rem;--radius-md:.45rem;--radius-lg:.85rem;--radius-xl:1rem;--space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-5:1.5rem;--space-6:2rem;--text-xs:.75rem;--text-sm:.875rem;--text-md:1rem;--text-lg:1.25rem;--font-sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
[data-theme="light"]{color-scheme:light;--bg:#f4f3f8;--panel:#fffbff;--panel-raised:#e8e7ef;--panel-hover:#dddce6;--line:#c9c8d4;--line-soft:#dddce6;--text:#1c1b22;--muted:#5c5b6a;--blue:#33339a;--blue-strong:#3f3fad;--blue-strong-hover:#33338f;--on-accent:#ffffff;--amber:#8a4b00;--green:#0f6b45;--red:#a32020;--violet:#5b3d99;--card:#fffbff;--border:#c9c8d4;--shadow:0 16px 40px rgb(28 27 34 / 12%)}
body{font-family:var(--font-sans);max-width:1080px;margin:0 auto;padding:24px;background:var(--bg);color:var(--text)}
h1{font-size:var(--text-lg);margin:0 0 4px}
a:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.sub{color:var(--muted);margin:0 0 20px;font-size:.9rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px 18px;margin:0 0 16px;min-width:0;overflow-wrap:anywhere}
.panel h2{font-size:1.05rem;margin:0 0 10px}
.panel.error{border-color:var(--red)}
.err{color:var(--red);font-family:ui-monospace,monospace;font-size:.85rem}
table{display:block;width:100%;max-width:100%;overflow-x:auto;border-collapse:collapse;font-size:.85rem}
th{text-align:left;border-bottom:2px solid var(--line);padding:4px 6px}
td{border-bottom:1px solid var(--line-soft);padding:4px 6px;vertical-align:top}
.num{text-align:right;font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,monospace;font-size:.8rem}
.lane{font-weight:600}
.chip{display:inline-block;max-width:100%;background:var(--panel-raised);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:1px 8px;margin:1px 2px;font-size:.75rem;font-family:ui-monospace,monospace;white-space:normal;overflow-wrap:anywhere}
.note{font-size:.8rem;color:var(--muted);margin:10px 0 0}
.warn{font-size:.85rem;background:var(--panel-raised);border:1px solid var(--amber);color:var(--text);border-radius:var(--radius-md);padding:8px 10px;overflow-wrap:anywhere}
.ok{font-size:.85rem;color:var(--green)}
.dim{color:var(--muted)}
.brow{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:.85rem}
.blabel{width:150px;flex:none}
.bar{display:inline-block;height:14px;background:var(--blue);border-radius:3px;min-width:4px}
.bar.stale{background:var(--red)}
.bar.cap{background:linear-gradient(90deg,var(--blue),var(--blue-strong))}
.bnum{font-variant-numeric:tabular-nums;font-weight:600}
.bval{font-size:.85rem}
.statgrid{display:flex;gap:12px;flex-wrap:wrap}
.stat{border:1px solid var(--line);border-radius:var(--radius-md);padding:10px 16px;min-width:100px;text-align:center;background:var(--panel-raised)}
.stat .sv{display:block;font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .sl{font-size:.75rem;color:var(--muted)}
.stat.good .sv{color:var(--green)}.stat.bad .sv{color:var(--red)}.stat.pend .sv{color:var(--amber)}
.spark{width:100%;max-width:420px;height:60px;margin-top:8px}
.expired td{background:color-mix(in srgb, var(--red) 22%, var(--panel))}
</style></head>
<body><h1>Room health</h1><p>Fixture shell — live page is generated by scripts/room-health.mjs.</p></body></html>
